# The EV/HEV layer of the family: HEVService's frames on 0c 88 01 8c, which
# any electrified car on this software stack shares. Decoders only.
schema: 1
name: hkmc-gen5w-ev
extends: hkmc-gen5w
title: "HKMC Gen5 Wide, EV/HEV layouts (HEVService)"
abstract: true

headers:
  hev:    { hdr: "0c 88 01 8c", dir: from_micom, status: captured, ref: "logcat MicomD 2026-10-16" }
  hev_tx: { hdr: "88 0c 01 0c", dir: to_micom,   status: captured, ref: "the poll frame's; HEVService sendPacket(0x88, 0x0c, func)" }

# Layouts are HEVService's handlers (func = hdr[3]<<8 | cmd, offsets as they
# index the payload, integers big endian); units are the HEVFlag names'
# (_W, _WH, KW), other scales unknown. The header's third byte is left open
# ("??"): these frames were always matched on the rest of it. 0xff and 0xffff
# read as "not available".
messages:
  - name: "Status flag"
    dir: from_micom
    hdr: "0c 88 ?? 8c"
    cmd: 0x02
    # Id, then a 16-bit value. Only id 0x57 (HEVFlag 0x4f, the climate power
    # draw) has been seen. Named apart from the power block's "Climate power":
    # telemetry keys readings by name.
    length: 3
    when: [ { off: 0, eq: 0x57 } ]
    fields:
      - { name: "Climate power draw", off: 1, type: u16, unit: " W" }
    status: code
    ref: "HEVService status-flag setter; seen live as 57 00 NN"

  # Ids 0x2a and 0x25 (HEVFlag ADDED_DIST_DATC_OFF): the range as the car
  # computes it, then what switching the climate off would add; sent on
  # change only. The EV app shows the first as "climate on", the sum as
  # "climate off". Same field names: telemetry keys readings by name.
  - name: "Range, climate"
    dir: from_micom
    hdr: "0c 88 ?? 8c"
    cmd: 0x02
    length: 4
    when: [ { off: 0, eq: 0x2a } ]
    fields:
      - { name: "Range, climate on",        off: 1, type: u16, unit: " km" }
      - { name: "Range added, climate off", off: 3,            unit: " km" }
    status: captured
    ref: "HEVService flag ADDED_DIST_DATC_OFF (0x26); seen live as 2a 00 f3 08 beside cluster Range=243 km"
  - name: "Range, climate (0x25)"
    dir: from_micom
    hdr: "0c 88 ?? 8c"
    cmd: 0x02
    length: 4
    when: [ { off: 0, eq: 0x25 } ]
    fields:
      - { name: "Range, climate on",        off: 1, type: u16, unit: " km" }
      - { name: "Range added, climate off", off: 3,            unit: " km" }
    status: captured
    ref: "HEVService flag ADDED_DIST_DATC_OFF (0x26); seen live as 25 01 6b 07"

  # More of HEVService's items (0x8c02 [id] ...), each sent on change: a u8
  # at byte 2 or a u16 at bytes 1-2.
  - name: "Charge time to full"
    dir: from_micom
    hdr: "0c 88 ?? 8c"
    cmd: 0x02
    length: 3
    when: [ { off: 0, eq: 0x14 } ]
    fields:
      - { name: "Charge time to full", off: 1, type: u16, unit: " min" }
    status: captured
    ref: "HEVService item 0x14 REAL_SC_REM_TIME (HEVFlag CHARGING_INTEGRATED_REM_TIME): the time left while charging; seen live falling 1 a minute to 0 at the end"
  - name: "Charge time estimate, DC"
    dir: from_micom
    hdr: "0c 88 ?? 8c"
    cmd: 0x02
    length: 3
    when: [ { off: 0, eq: 0x0e } ]
    fields:
      - { name: "Charge time estimate, DC", off: 1, type: u16, unit: " min" }
    status: code
    ref: "HEVService item 0x0e QC_REM_TIME: a DC fast charge's time to full, while not charging; 10-41 seen"
  - name: "Charge time estimate, AC"
    dir: from_micom
    hdr: "0c 88 ?? 8c"
    cmd: 0x02
    length: 3
    when: [ { off: 0, eq: 0x13 } ]
    fields:
      - { name: "Charge time estimate, AC", off: 1, type: u16, unit: " min" }
    status: code
    ref: "HEVService item 0x13 SC_REM_TIME_EVSE_PHEV, an EV's NOT_CHAR_EVSE_REM_TIME (CAN DB generation > 0): a wallbox's time to full, while not charging; 20-220 seen, rising as the charge fell"
  - name: "Charge time estimate, DC custom"
    dir: from_micom
    hdr: "0c 88 ?? 8c"
    cmd: 0x02
    length: 3
    when: [ { off: 0, eq: 0x61 } ]
    fields:
      - { name: "Charge time estimate, DC custom", off: 1, type: u16, unit: " min" }
    status: code
    ref: "HEVService item 0x61 VCRM_QCHCHRGRMNTIMEVALCUSTOM: DC time to full at the custom charge power"
  - name: "Charge limit, AC"
    dir: from_micom
    hdr: "0c 88 ?? 8c"
    cmd: 0x02
    length: 3
    when: [ { off: 0, eq: 0x21 } ]
    fields:
      - { name: "Charge limit, AC", off: 2, scale: 0.5, unit: " %" }
    status: code
    ref: "HEVService item 0x21 SOC_SC_CHG (TARGET_SOC_SLOW): x0.5 % from the set side's pct / 0.5; never seen"
  - name: "Charge limit, DC"
    dir: from_micom
    hdr: "0c 88 ?? 8c"
    cmd: 0x02
    length: 3
    when: [ { off: 0, eq: 0x22 } ]
    fields:
      - { name: "Charge limit, DC", off: 2, scale: 0.5, unit: " %" }
    status: code
    ref: "HEVService item 0x22 SOC_QC_CHG (TARGET_SOC_QUICK): x0.5 % from the set side's pct / 0.5; never seen"
  # The EV settings' "Battery Conditioning Mode" as the car holds it (set
  # with batt-cond-mode): 2 on, 1 off, any other value none.
  - name: "Battery conditioning mode"
    dir: from_micom
    hdr: "0c 88 ?? 8c"
    cmd: 0x02
    length: 3
    when: [ { off: 0, eq: 0x63 } ]
    fields:
      - { name: "Battery conditioning mode", off: 2, enum: batt_cond_mode }
    status: code
    ref: "HEVService item 0x63 EV_BATTERYCONDITIONING (HEVFlag 0x5e); never seen"
  # Why the BMS would not condition, stock's popup: 1 the driving range too
  # short, 2 the battery temperature already optimal, 3 a heat-management
  # error.
  - name: "Battery conditioning failure"
    dir: from_micom
    hdr: "0c 88 ?? 8c"
    cmd: 0x02
    length: 3
    when: [ { off: 0, eq: 0x79 } ]
    fields:
      - { name: "Battery conditioning failure", off: 2, enum: batt_cond_failure }
    status: code
    ref: "HEVService item 0x79 BMS_BATTCONDFAILPOPUP (HEVFlag 0x73); never seen"
  # VCU ready (HEVFlag VCU_RDY): in emulation stock's EV page shows no range
  # until it is 1.
  - name: "VCU ready"
    dir: from_micom
    hdr: "0c 88 ?? 8c"
    cmd: 0x02
    length: 3
    when: [ { off: 0, eq: 0x2c } ]
    fields:
      - { name: "VCU ready", off: 2, type: bool }
    status: code
    ref: "HEVService item 0x2c VCU_RDY (HEVFlag 45); never seen; stock under QEMU with micom-fake: the range appears once it is 1"
  - name: "Winter mode"
    dir: from_micom
    hdr: "0c 88 ?? 8c"
    cmd: 0x02
    length: 3
    when: [ { off: 0, eq: 0x44 } ]
    fields:
      - { name: "Winter mode", off: 2 }   # values unknown
    status: code
    ref: "HEVService item 0x44 XEV_WINTERMODESTA; never seen"
  # The AC charging current as the car holds it: stock shows 2 as its
  # second choice, 3 as its third, anything else as its first.
  - name: "AC charging current"
    dir: from_micom
    hdr: "0c 88 ?? 8c"
    cmd: 0x02
    length: 3
    when: [ { off: 0, eq: 0x51 } ]
    fields:
      - { name: "AC charging current", off: 2, enum: ac_current }
    status: code
    ref: "HEVService item 0x51 OBC_CHGINCURRMODSTA, getInCurrModeValue(v, true); never seen"
  - name: "V2L discharge limit"
    dir: from_micom
    hdr: "0c 88 ?? 8c"
    cmd: 0x02
    length: 3
    when: [ { off: 0, eq: 0x50 } ]
    fields:
      - { name: "V2L discharge limit", off: 2 }   # raw: % or x0.5 % unknown
    status: code
    ref: "HEVService item 0x50 CHRG_V2XDISCHRGLIMSOCVAL_SYNC; never seen"
  - name: "Range at charge limit, AC"
    dir: from_micom
    hdr: "0c 88 ?? 8c"
    cmd: 0x02
    length: 3
    when: [ { off: 0, eq: 0x1f } ]
    fields:
      - { name: "Range at charge limit, AC", off: 1, type: u16, unit: " km" }
    status: code
    ref: "HEVService item 0x1f SOC_DTE_SC_CHG (DTE_SLOW_CHARGER_SOC); 406-414 seen"
  - name: "Range at charge limit, DC"
    dir: from_micom
    hdr: "0c 88 ?? 8c"
    cmd: 0x02
    length: 3
    when: [ { off: 0, eq: 0x20 } ]
    fields:
      - { name: "Range at charge limit, DC", off: 1, type: u16, unit: " km" }
    status: code
    ref: "HEVService item 0x20 SOC_DTE_QC_CHG (DTE_QUICK_CHARGER_SOC)"
  - name: "Trip energy"
    dir: from_micom
    hdr: "0c 88 ?? 8c"
    cmd: 0x02
    length: 3
    when: [ { off: 0, eq: 0x5e } ]
    fields:
      - { name: "Trip energy", off: 1, type: u16, scale: 0.1, unit: " kWh" }
    status: code
    ref: "HEVService item 0x5e XEV_BATPWRSUM_KWH: the battery energy used; x0.1 kWh is a fit (20 -> 360 while the pack's energy fell 33 kWh), medium confidence"
  - name: "Average efficiency"
    dir: from_micom
    hdr: "0c 88 ?? 8c"
    cmd: 0x02
    length: 3
    when: [ { off: 0, eq: 0x06 } ]
    fields:
      - { name: "Average efficiency", off: 1, type: u16, scale: 0.1, unit: "" }
    status: code
    ref: "HEVService item 0x06 CLU_AVGFCL (AVG_FCI): 0-0x3ff; x0.1, per kWh in the unit item 0x05 gives (km or mi), is a guess, medium confidence; 31-41 seen"

  # 0x8c01, stock's bulk answer to hev-status-request: the same range and
  # climate-off addition as above, so a value exists before the first
  # change. Never captured: micomd sends the request only with
  # -hev-status-request. Stock reads each later byte only when the frame
  # reaches it; a frame long enough for the battery conditioning bytes is
  # read by the first of these, any other by the second.
  - name: "HEV status (full)"
    dir: from_micom
    hdr: "0c 88 ?? 8c"
    cmd: 0x01
    min_length: 0xb7
    fields:
      - { name: "Range, climate on",        off: 0x3c, type: u16, unit: " km" }
      - { name: "Range added, climate off", off: 0x36,            unit: " km" }
      - { name: "Average efficiency",        off: 9,  type: u16, scale: 0.1 }
      - { name: "Charge time estimate, DC",  off: 19, type: u16, unit: " min" }
      - { name: "Charge time estimate, AC",  off: 29, type: u16, unit: " min" }
      - { name: "Charge time to full",       off: 31, type: u16, unit: " min" }
      - { name: "Range at charge limit, AC", off: 46, type: u16, unit: " km" }
      - { name: "Range at charge limit, DC", off: 48, type: u16, unit: " km" }
      - { name: "Charge limit, AC",          off: 50, scale: 0.5, unit: " %" }
      - { name: "Charge limit, DC",          off: 51, scale: 0.5, unit: " %" }
      - { name: "Battery conditioning mode",    off: 0x8d, enum: batt_cond_mode }
      - { name: "Battery conditioning failure", off: 0xb6, enum: batt_cond_failure }
    status: code
    ref: "HEVService DATA_M_RESP as below, and [0x8d] into EV_BATTERYCONDITIONING (len >= 0x8e), [0xb6] into BMS_BATTCONDFAILPOPUP"
  - name: "HEV status"
    dir: from_micom
    hdr: "0c 88 ?? 8c"
    cmd: 0x01
    min_length: 0x40
    fields:
      - { name: "Range, climate on",        off: 0x3c, type: u16, unit: " km" }
      - { name: "Range added, climate off", off: 0x36,            unit: " km" }
      - { name: "Average efficiency",        off: 9,  type: u16, scale: 0.1 }
      - { name: "Charge time estimate, DC",  off: 19, type: u16, unit: " min" }
      - { name: "Charge time estimate, AC",  off: 29, type: u16, unit: " min" }
      - { name: "Charge time to full",       off: 31, type: u16, unit: " min" }
      - { name: "Range at charge limit, AC", off: 46, type: u16, unit: " km" }
      - { name: "Range at charge limit, DC", off: 48, type: u16, unit: " km" }
      - { name: "Charge limit, AC",          off: 50, scale: 0.5, unit: " %" }
      - { name: "Charge limit, DC",          off: 51, scale: 0.5, unit: " %" }
    status: code
    ref: "HEVService DATA_M_RESP (func 0x8c01, len >= 0x40) into flags ADDED_DIST_DATC_OFF, AVG_FCI, the charge times (the AC one at 29, CAN DB generation > 0), TARGET_SOC_SLOW/QUICK and DTE_SLOW/QUICK_CHARGER_SOC"

  - name: "EV power block"
    dir: from_micom
    hdr: "0c 88 ?? 8c"
    cmd: 0x5c
    min_length: 29
    fields:
      - { name: "Other ECUs",           off: 0,                invalid: 0xff }
      - { name: "AVN motor power",      off: 1,  type: u16,    invalid: 0xffff }
      - { name: "E-compressor",         off: 3,  type: u16,    invalid: 0xffff }
      - { name: "PTC heater",           off: 8,  type: u16,    invalid: 0xffff }
      - { name: "Climate total",        off: 10, type: u16,    invalid: 0xffff, unit: " W" }
      - { name: "Battery heater",       off: 12,               invalid: 0xff,   unit: " W" }
      - { name: "Battery heater total", off: 13,               invalid: 0xff,   unit: " Wh" }
      - { name: "MG1 power",            off: 14, type: u16,    invalid: 0xffff, unit: " kW" }
      - { name: "MG2 power",            off: 16, type: u16,    invalid: 0xffff, unit: " kW" }
      - { name: "MG1 energy",           off: 18, type: u16,    invalid: 0xffff, unit: " Wh" }
      - { name: "MG2 energy",           off: 20, type: u16,    invalid: 0xffff, unit: " Wh" }
      - { name: "LDC load",             off: 22,               invalid: 0xff }
      - { name: "Climate power",        off: 23, type: u16,    invalid: 0xffff, unit: " W" }
      - { name: "Battery compressor",   off: 25, type: u16,    invalid: 0xffff, unit: " W" }
      - { name: "Battery energy",       off: 27, type: u16,    invalid: 0xffff, unit: " Wh" }
    status: code
    ref: "HEVService setHEVStatusValue calls"

  - name: "Departure timers"
    dir: from_micom
    hdr: "0c 88 ?? 8c"
    cmd: 0x55
    min_length: 5
    fields:
      - { name: "Departure 1 hour",        off: 3, bits: "4:0" }
      - { name: "Departure 1 minute bits", off: 3, bits: "7:5" }
      - { name: "Departure 2 hour",        off: 4, bits: "4:0" }
      - { name: "Departure 2 minute bits", off: 4, bits: "7:5" }
    status: code
    # Bytes 0-2 vary frame to frame (noise, then a counter) and 5-7 were 0;
    # none is decoded. Bytes 3 and 4 were 0c in all 43k frames of a 2026-11
    # EV6 capture: hour 12, minute bits 0, i.e. no timer ever set, so the
    # layout is unchecked against a real setting. The set side is
    # sendPacket(0x88, 0x0c, 0x0c06) with 7 bytes packed from 28 slots,
    # LSB- or MSB-first by the CAN DB generation (boot record byte 120): a
    # car's file has its own (kia-ev6-gen5w: ev-departures).
    ref: "HEVService; captured only at the default"

  # The on-board charger ready (OBC_SYSRDYSTA). Where it sits depends on the
  # CAN DB generation (byte 120 of the 0x8101 boot record): bits 7:6 before
  # generation 2, bits 1:0 from it; a car's file picks its own.
  - name: "Charger state"
    dir: from_micom
    hdr: "0c 88 ?? 8c"
    cmd: 0x4f
    min_length: 4
    fields:
      - { name: "Charger ready", off: 3, bits: "7:6" }
    status: code
    ref: "HEVService OBC ready (CAN DB generation < 2)"

send:
  # Inferred statically, never seen sent; -hev-status-request sends it.
  - { name: hev-status-request, frame: "ff 88 0c 01 0c 01 00 01 76", status: inferred, ref: "HEVService requestInitHevStatus: func 0x0c01, empty payload; answered by 0x8c01" }

enums:
  # HEVManager.setBatteryConditioning's mode; "default" is what stock sends
  # 120 ms after it (HEVService$5).
  batt_cond_mode: { default: 0, "off": 1, "on": 2 }
  batt_cond_failure: { range: 1, temperature_optimal: 2, heat_management: 3 }
  # setOBCCurrent / getInCurrModeValue: the EV settings' three choices, in
  # the app's order (Maximum, Reduced, Minimum: the order is the app's list,
  # the names the owner's manual's); default is the pulse's idle value.
  ac_current: { default: 0, maximum: 1, reduced: 2, minimum: 3 }
