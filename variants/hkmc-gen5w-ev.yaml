# The EV/HEV layer of the family: HEVService's frames on 0c 88 01 8c, which
# any electrified car on this software stack shares. Decoders only.
schema: 1
name: hkmc-gen5w-ev
extends: hkmc-gen5w
title: "HKMC Gen5 Wide, EV/HEV layouts (HEVService)"
abstract: true

headers:
  hev: { hdr: "0c 88 01 8c", dir: from_micom, status: captured, ref: "logcat MicomD 2026-10-16" }

# Layouts are HEVService's handlers (func = hdr[3]<<8 | cmd, offsets as they
# index the payload, integers big endian); units are the HEVFlag names'
# (_W, _WH, KW), other scales unknown. The header's third byte is left open
# ("??"): these frames were always matched on the rest of it. 0xff and 0xffff
# read as "not available".
messages:
  - name: "Status flag"
    dir: from_micom
    hdr: "0c 88 ?? 8c"
    cmd: 0x02
    # Id, then a 16-bit value. Only id 0x57 (HEVFlag 0x4f, the climate power
    # draw) has been seen. Named apart from the power block's "Climate power":
    # telemetry keys readings by name.
    length: 3
    when: [ { off: 0, eq: 0x57 } ]
    fields:
      - { name: "Climate power draw", off: 1, type: u16, unit: " W" }
    status: code
    ref: "HEVService status-flag setter; seen live as 57 00 NN"

  - name: "EV power block"
    dir: from_micom
    hdr: "0c 88 ?? 8c"
    cmd: 0x5c
    min_length: 29
    fields:
      - { name: "Other ECUs",           off: 0,                invalid: 0xff }
      - { name: "AVN motor power",      off: 1,  type: u16,    invalid: 0xffff }
      - { name: "E-compressor",         off: 3,  type: u16,    invalid: 0xffff }
      - { name: "PTC heater",           off: 8,  type: u16,    invalid: 0xffff }
      - { name: "Climate total",        off: 10, type: u16,    invalid: 0xffff, unit: " W" }
      - { name: "Battery heater",       off: 12,               invalid: 0xff,   unit: " W" }
      - { name: "Battery heater total", off: 13,               invalid: 0xff,   unit: " Wh" }
      - { name: "MG1 power",            off: 14, type: u16,    invalid: 0xffff, unit: " kW" }
      - { name: "MG2 power",            off: 16, type: u16,    invalid: 0xffff, unit: " kW" }
      - { name: "MG1 energy",           off: 18, type: u16,    invalid: 0xffff, unit: " Wh" }
      - { name: "MG2 energy",           off: 20, type: u16,    invalid: 0xffff, unit: " Wh" }
      - { name: "LDC load",             off: 22,               invalid: 0xff }
      - { name: "Climate power",        off: 23, type: u16,    invalid: 0xffff, unit: " W" }
      - { name: "Battery compressor",   off: 25, type: u16,    invalid: 0xffff, unit: " W" }
      - { name: "Battery energy",       off: 27, type: u16,    invalid: 0xffff, unit: " Wh" }
    status: code
    ref: "HEVService setHEVStatusValue calls"

  - name: "Departure timers"
    dir: from_micom
    hdr: "0c 88 ?? 8c"
    cmd: 0x55
    min_length: 5
    fields:
      - { name: "Departure 1 hour",        off: 3, bits: "4:0" }
      - { name: "Departure 1 minute bits", off: 3, bits: "7:5" }
      - { name: "Departure 2 hour",        off: 4, bits: "4:0" }
      - { name: "Departure 2 minute bits", off: 4, bits: "7:5" }
    status: code
    ref: "HEVService"

  - name: "Charger state"
    dir: from_micom
    hdr: "0c 88 ?? 8c"
    cmd: 0x4f
    min_length: 4
    fields:
      - { name: "Charger ready bits", off: 3, bits: "7:6" }
    status: code
    ref: "HEVService"
