# Kia EV6 (project CV), Mobis DAudio Plus Gen5 Wide. Every value was seen on
# this car, by pressing the control or in a capture, unless its status says
# otherwise. The send entries and key bindings are those the device's systemd
# unit passes as -allow and -keymap (pmaports device-mobis-g5w).
schema: 1
name: kia-ev6-gen5w
extends: hkmc-gen5w-ev
title: "Kia EV6 (CV), Mobis DAudio Plus Gen5 Wide"

match:
  cmdline:
    # The stock bootloader's vehicle code for this car. country_info=0x01
    # (USA) was on the same command line; left out so an EV6 of another
    # region matches until it shows a difference.
    vehicle_info: 0xcc
  status: captured
  ref: "stock /proc/cmdline, 2026-11-07 (ro.product.device=wp_daudioplus_cvev_us)"

expect:
  climate_variant: 2   # persist.sys.climate.variant on the stock unit
  amp_type: 2          # persist.sys.amptype on the stock unit (0 is the internal amp)

# The micom relays these from other nodes of the car, each with its own header.
headers:
  keys:          { hdr: "07 84 01 87", dir: from_micom, status: captured }
  climate_panel: { hdr: "43 c2 00 c3", dir: from_micom, status: captured }
  seat_node:     { hdr: "55 ca 00 d5", dir: from_micom, status: captured, ref: "seat heat; the driver's door switches" }
  body:          { hdr: "44 c1 00 c4", dir: from_micom, status: captured, ref: "doors; repeats seat heat and windows" }
  camera:        { hdr: "01 c4 01 81", dir: from_micom, status: captured }
  cluster_rx:    { hdr: "0d 8f 01 8d", dir: from_micom, status: captured, ref: "battery and cruise; cluster_tx's reverse" }
  poll_tx:       { hdr: "88 0c 01 0c", dir: to_micom, status: captured }
  # ClusterService.sendPacket: sndId 0x8f, rcvId 0x0d, type 1, funcH 0x0d.
  cluster_tx:    { hdr: "8f 0d 01 0d", dir: to_micom, status: captured, ref: "the ack profile frame; stock ClusterService" }
  status_tx:     { hdr: "c3 4d 00 4d", dir: to_micom, status: captured }
  clock_tx:      { hdr: "c2 43 00 43", dir: to_micom, status: captured }
  # The micom's display node (backlight): micom firmware, in emulation.
  display_rx:    { hdr: "08 8c 01 88", dir: from_micom, status: code, ref: "EV6 micom firmware V002.208, micom-run" }
  display_tx:    { hdr: "8c 08 01 08", dir: to_micom, status: code, ref: "EV6 micom firmware V002.208, micom-run" }

keys:
  frame: { hdr: keys, cmd: 0x01 }   # Func 0x8701
  # Labels from pressing each; the keys are the LIVI mapping of the unit's
  # -keymap (LIVI's scancode table has no phone or voice keys, so those are
  # F13-F22). They are injected only with -keys; -keymap still wins.
  push:
    - { type: 0, code: 1,  label: "Volume knob",       key: KEY_MUTE }
    - { type: 0, code: 2,  label: "Seek <",            key: KEY_PREVIOUSSONG }
    - { type: 0, code: 3,  label: "Track >",           key: KEY_NEXTSONG }
    - { type: 0, code: 4,  label: "Map",               key: KEY_F17 }
    - { type: 0, code: 5,  label: "Nav",               key: KEY_HOME }
    - { type: 1, code: 1,  label: "Tune knob",         key: KEY_ENTER }
    - { type: 1, code: 2,  label: "Radio",             key: KEY_F18 }
    - { type: 1, code: 3,  label: "Media",             key: KEY_F19 }
    - { type: 1, code: 4,  label: "Star",              key: KEY_F20 }
    - { type: 1, code: 5,  label: "Setup",             key: KEY_F22 }
    # The steering wheel.
    - { type: 2, code: 2,  label: "Wheel up",          key: KEY_NEXTSONG }
    - { type: 2, code: 3,  label: "Wheel down",        key: KEY_PREVIOUSSONG }
    - { type: 2, code: 4,  label: "Wheel mode",        key: KEY_PLAYPAUSE }
    - { type: 2, code: 5,  label: "Wheel volume push", key: KEY_MUTE }
    - { type: 2, code: 6,  label: "Wheel volume up",   key: KEY_VOLUMEUP }
    - { type: 2, code: 7,  label: "Wheel volume down", key: KEY_VOLUMEDOWN }
    - { type: 2, code: 8,  label: "Wheel voice",       key: KEY_F13 }
    - { type: 2, code: 10, label: "Wheel call",        key: KEY_F14 }
    - { type: 2, code: 11, label: "Wheel star",        key: KEY_F21 }
  # A knob step is the high nibble of the second byte: 1 up, 0 down.
  knobs:
    - { type: 8, code: 1, label: "Tune knob",   up: KEY_F15,      down: KEY_F16 }
    - { type: 9, code: 1, label: "Volume knob", up: KEY_VOLUMEUP, down: KEY_VOLUMEDOWN }

signals:
  # The climate panel. One change arrives as a burst of fields, 1b 01 ... 1b 00.
  - name: climate-burst
    hdr: climate_panel
    cmd: 0x1b
    burst: { begin: 0x01 }
    lines: { 0x01: "Climate update begins" }
    unknown_line: "Climate update ends"
  - name: climate-driver-set
    hdr: climate_panel
    cmd: [0x05, 0x07]
    label: "Climate driver set point"
    number: { add: 56, format: "%d F" }          # degrees Fahrenheit less 56
    values: { 0x00: { text: "off", state: 0 } }  # the zone off
    state: driver_set_f
  - name: climate-passenger-set
    hdr: climate_panel
    cmd: [0x09, 0x0b]
    label: "Climate passenger set point"
    number: { add: 56, format: "%d F" }
    values: { 0x00: { text: "off", state: 0 } }  # off with driver only
    state: passenger_set_f
  - name: climate-airflow
    hdr: climate_panel
    cmd: 0x0d
    label: "Climate airflow"
    enum: { 0: "off", 1: "face", 2: "face and feet", 3: "feet", 4: "feet and defrost", 5: "defrost", 8: "auto" }
    state: airflow
  - { name: climate-auto,        hdr: climate_panel, cmd: 0x0f, label: "Climate auto",        flag: { on: 1, off: 0 }, state: auto }
  - { name: climate-ac,          hdr: climate_panel, cmd: 0x11, label: "Climate A/C",         flag: { on: 1, off: 0 }, state: ac }
  - name: climate-fan
    hdr: climate_panel
    cmd: 0x15
    label: "Climate fan"
    fan: { off: 0x00, auto: 0x0a, levels: [2, 9] }   # levels 1 to 8
    state: fan
  - { name: climate-driver-only, hdr: climate_panel, cmd: 0x19, label: "Climate driver only", flag: { on: 1, off: 0 }, state: driver_only }
  # Recirculation off is the car's 2.
  - { name: climate-recirculation, hdr: climate_panel, cmd: [0x1e, 0x43], label: "Climate recirculation", flag: { on: 1, off: 2 }, state: recirculation }
  - name: climate-zones
    hdr: climate_panel
    cmd: 0x27
    label: "Climate zones"
    flag: { on: 1, off: "*", on_text: "synced", off_text: "independent" }
    state: zones_synced
  - { name: climate-heat, hdr: climate_panel, cmd: 0x33, label: "Climate heat", flag: { on: 1, off: 0 } }
  - name: climate-auto-level
    hdr: climate_panel
    cmd: 0x4f
    label: "Climate auto level"
    number: { add: -1, format: "%d", wrap: true }   # 00 reads as 255, as it always did
    values: { 0x01: "off" }
  - name: climate-auto-level-inverse
    hdr: climate_panel
    cmd: 0x50
    label: "Climate auto level (inverse)"
    number: { mul: -1, add: 5, format: "%d" }
    values: { 0x01: "off" }

  # Seat heat: 02 off, 06 to 08 levels 1 to 3; repeated on the body node.
  # Read from the first byte whatever the length (len: 0), as it always was.
  - { name: seat-heat-driver,            hdr: seat_node, cmd: 0x20, len: 0, label: "Seat heat, driver",             number: &seat { add: -5, range: [6, 8], format: "heat level %d" }, values: &seatoff { 0x02: { text: "off", state: 0 } }, state: driver_seat_heat }
  - { name: seat-heat-passenger,         hdr: seat_node, cmd: 0x21, len: 0, label: "Seat heat, passenger",         number: *seat, values: *seatoff, state: passenger_seat_heat }
  - { name: seat-heat-driver-repeat,     hdr: body,      cmd: 0x19, len: 0, label: "Seat heat, driver (repeat)",   number: *seat, values: *seatoff, state: driver_seat_heat }
  - { name: seat-heat-passenger-repeat,  hdr: body,      cmd: 0x1b, len: 0, label: "Seat heat, passenger (repeat)",number: *seat, values: *seatoff, state: passenger_seat_heat }

  # Power windows of the driver and front passenger, from the driver's door
  # switches. Switch: 0 released, 1 and 2 held down and up, 5 and 6 pressed
  # hard (auto down and up). Position: coarse, 0 closed (top) to 3 fully
  # down, sent when it crosses a step. The rear windows were not tried.
  - { name: window-driver-switch,    hdr: seat_node, cmd: 0x08, label: "Window driver",    enum: &winsw { 0: "switch released", 1: "switch down", 2: "switch up", 5: "switch hard down (auto)", 6: "switch hard up (auto)" }, unknown: "switch code %#02x" }
  - { name: window-passenger-switch, hdr: seat_node, cmd: 0x0b, label: "Window passenger", enum: *winsw, unknown: "switch code %#02x" }
  - { name: window-driver-position,    hdr: seat_node, cmd: 0x06, label: "Window driver",    enum: &winpos { 0: "position 0 of 3 (closed)", 1: "position 1 of 3", 2: "position 2 of 3", 3: "position 3 of 3 (fully down)" }, unknown: "position code %#02x" }
  - { name: window-passenger-position, hdr: seat_node, cmd: 0x09, label: "Window passenger", enum: *winpos, unknown: "position code %#02x" }
  - { name: window-driver-switch-repeat,      hdr: body, cmd: 0x26, label: "Window driver",    enum: *winsw,  unknown: "switch code %#02x",   suffix: " (repeat)" }
  - { name: window-passenger-switch-repeat,   hdr: body, cmd: 0x27, label: "Window passenger", enum: *winsw,  unknown: "switch code %#02x",   suffix: " (repeat)" }
  - { name: window-driver-position-repeat,    hdr: body, cmd: 0x24, label: "Window driver",    enum: *winpos, unknown: "position code %#02x", suffix: " (repeat)" }
  - { name: window-passenger-position-repeat, hdr: body, cmd: 0x25, label: "Window passenger", enum: *winpos, unknown: "position code %#02x", suffix: " (repeat)" }

  # Doors, on the body node: each door has a lock command (00 locked, 01
  # unlocked) and the next number is its open one (01 open, 00 closed).
  # The trunk and the hood have no lock command. Other values: no line.
  - { name: door-front-right-lock, hdr: body, cmd: 0x00, label: "Door front right", enum: &lock { 0: "locked", 1: "unlocked" }, unknown: "" }
  - { name: door-front-right-open, hdr: body, cmd: 0x01, label: "Door front right", enum: &open { 0: "closed", 1: "open" }, unknown: "" }
  - { name: door-driver-lock,      hdr: body, cmd: 0x02, label: "Door driver",      enum: *lock, unknown: "" }
  - { name: door-driver-open,      hdr: body, cmd: 0x03, label: "Door driver",      enum: *open, unknown: "" }
  - { name: door-rear-left-lock,   hdr: body, cmd: 0x04, label: "Door rear left",   enum: *lock, unknown: "" }
  - { name: door-rear-left-open,   hdr: body, cmd: 0x05, label: "Door rear left",   enum: *open, unknown: "" }
  - { name: door-rear-right-lock,  hdr: body, cmd: 0x07, label: "Door rear right",  enum: *lock, unknown: "" }
  - { name: door-rear-right-open,  hdr: body, cmd: 0x08, label: "Door rear right",  enum: *open, unknown: "" }
  - { name: trunk,                 hdr: body, cmd: 0x06, label: "Trunk",            enum: *open, unknown: "" }
  - { name: hood,                  hdr: body, cmd: 0x11, label: "Hood",             enum: *open, unknown: "" }

  # The system node's bitmask of what keeps the micom awake: bit 0 always
  # set, then one bit per open door and the trunk. Other bits not known.
  - name: open-doors
    hdr: system_rx
    cmd: 0x2f
    label: "Open doors"
    bits: { always: 0x01, none: "none", names: { 1: "trunk", 2: "front right", 3: "driver", 4: "rear right", 5: "rear left" } }

  # The rear camera button: 09 when pressed on, 00 off, with cmd 52 (six
  # bytes) following. Two presses seen, so the other values are unknown.
  - name: rear-camera
    hdr: camera
    cmd: 0x51
    label: "Rear camera"
    enum: { 0x00: "off", 0x09: "on" }
    unknown_line: "Rear camera mode: code %#02x"

# Routine traffic Android sent at a steady rate (logcat MicomD, 2026-10-16),
# sent as seen: what each means, and which the micom needs, is not known. The
# ack and status payloads are not constant: a strace of 2026-11-07 has ack
# byte 3 = 1d and status 08 c6 b0 73 06 32 ab 37, so they carry state.
profile:
  - name: poll        # answered by the 31-byte EV power block
    every: 1s
    frame: "ff 88 0c 01 0c 5c 00 01 2b"
    status: captured
    ref: "logcat MicomD 2026-10-16; strace 2026-11-07 identical"
  # Not an ack: the cluster's TBTSubInfo, func 0x0D03. Remaining distance and
  # ETA (invalid: no route), then the compass, byte 3 = heading / 7.5 degrees.
  # The capture's 0e (105 degrees; 1d in the 2026-11-07 strace) was the car's
  # heading then, so replaying it shows a wrong compass. With -input, the
  # cluster-sub-info message replaces it while a client feeds it.
  - name: ack
    every: 600ms
    frame: "ff 8f 0d 01 0d 03 00 0a ff ff ff 0e 03 ff ff 03 ff 76"
    status: captured
    ref: "logcat MicomD 2026-10-16"
  # The same with the compass as 3f, "no heading", as stock sends when its
  # route ends. Not captured yet: only with -code-profile.
  - name: tbt-sub-info
    every: 600ms
    frame: "ff 8f 0d 01 0d 03 00 0a ff ff ff 3f 03 ff ff 03 ff 47"
    opt_in: code
    replaces: ack
    status: code
    ref: "stock GpmNaviTBTManager / ClusterService$NaviCluster TBTSubInfo packer (hmg_nemesis projection-tbt, stock automotive-service smali)"
  - name: status
    every: 1s
    frame: "ff c3 4d 00 4d 17 00 09 08 d5 fc db 05 ff 81 2b 88"
    status: captured
    ref: "logcat MicomD 2026-10-16"
  # The two frames whose payload follows the wall clock: only with -clock,
  # as a wrong time may be stored by the car.
  # clock-sec is ?? a0 MM SS 80: the 2026-11-07 strace has 02 a0 14 32 80
  # at 20:20:50 and 02 a0 15 10 80 at 20:21:16 (the 01 of the first capture
  # was its minute, 20:01). The first byte was 04 then and 02 since: unknown.
  - name: clock-sec
    every: 1s
    opt_in: clock
    template: "ff 88 0c 01 0c 09 00 06 04 a0 {minute} {second} 80 .."
    status: captured
    ref: "logcat MicomD 2026-10-16 20:01:16-17; stock micomd strace 2026-11-07"
  - name: clock
    every: 1s
    opt_in: clock
    template: "ff c2 43 00 43 33 00 0c 02 02 {hour} {minute} {second} {month} 01 {year2} {day} 00 02 .."
    status: captured
    ref: "logcat MicomD 2026-10-16 20:01; strace 2026-11-07 matches the unit's clock"

# What the control socket may send when asked, with -allow-variant (inferred
# ones also need -allow-inferred). Captured from the stock micomd (strace on
# its UART) on a source switch: 0x020B AV mute set, 0x0201 mode (0e Media,
# 01 Radio), 0x0203 volume, then 0.2-1.3 s later 0x0238 AV mute release,
# which the micom answers with 0x820B.
send:
  - { name: av-mute-set,     frame: "ff 85 02 01 02 0b 00 03 02 01 70", status: captured, ref: "stock micomd strace, source switch" }
  - { name: mode-media,      frame: "ff 85 02 01 02 01 00 03 0e 00 77", status: captured, ref: "stock micomd strace, source switch" }
  - { name: mode-radio,      frame: "ff 85 02 01 02 01 00 03 01 00 78", status: captured, ref: "stock micomd strace, source switch" }
  - { name: av-mute-release, frame: "ff 85 02 01 02 38 00 03 02 00 42", status: captured, ref: "stock micomd strace, source switch" }
  - name: main-volume
    pattern: "ff 85 02 01 02 03 00 02 [00-23] .."
    status: captured
    ref: "stock micomd strace, source switch: levels 22-31"
    note: "levels 0-35: the maximum is unknown, 35 is the cap (the I2S card's control)"
  # Inferred statically, never seen sent.
  - { name: boot-mode-request,  frame: "ff 8a 01 01 01 01 00 01 74", status: inferred, ref: "SystemService; the micom answers 0x8101 with its last mode, mute and volume" }
  - { name: mode-09,            frame: "ff 85 02 01 02 01 00 03 09 00 70", status: inferred, ref: "MicomAudioService audio mode USB" }
  - { name: mode-12,            frame: "ff 85 02 01 02 01 00 03 12 00 6b", status: inferred, ref: "MicomAudioService audio mode MUSIC" }
  - { name: av-mute-release-0b, frame: "ff 85 02 01 02 0b 00 03 02 00 71", status: inferred, ref: "0x020B mute control: AV, RELEASE" }
  - { name: amp-mute-release,   frame: "ff 85 02 01 02 0b 00 03 01 00 72", status: inferred, ref: "0x020B mute control: AMP, RELEASE" }
  - { name: amp-mute-set,       frame: "ff 85 02 01 02 0b 00 03 01 01 73", status: inferred, ref: "0x020B mute control: AMP, SET" }

# The cluster's turn-by-turn guidance and compass, filled in from -input
# (docs/messages.md). Layouts are the stock packers', never captured, so
# status code: they also need -allow-inferred. The 16-bit integers are
# guessed big endian (Utils.shortToBytes is in framework.jar, not on disk).
# Here rather than in the family base because cluster-sub-info owns this
# car's ack profile entry, and tbt-turn's end names it.
messages:
  # TBTInfo, func 0x0D04: the next maneuver.
  - name: tbt-turn
    dir: to_micom
    hdr: cluster_tx
    cmd: 0x04
    length: 8
    fields:
      - { name: maneuver,          off: 0, enum: maneuver }
      - { name: side_street,       off: 1, type: u16, invalid: 0xffff }
      - { name: direction,         off: 3, scale: 7.5, min: 0, max: 360, default: 0 }   # degrees
      - { name: distance,          off: 4, type: u16, invalid: 0xffff }                 # its integer part
      - { name: unit,              off: 6, bits: "7:4", enum: distance_unit, invalid: 15 }
      - { name: side_street_combi, off: 6, bits: "3:0", default: 0 }
      # The progress bar, percent, in tenths. 0xE ("err -2") is not modelled.
      - { name: bar,               off: 7, bits: "7:4", scale: 10, min: 0, max: 100, invalid: 15 }
      - { name: distance_tenths,   off: 7, bits: "3:0", max: 9, invalid: 15 }
    every: 1s          # a guess: stock sends on change
    timeout: 30s
    # Stock's end of route (GPM releaseGuidance: updateTBTInfo(0, 0, 0, 0,
    # -1, 0, 0, 0, -1) and updateTBTSubInfo(0, -1, 0, ...)): 0x0D04
    # 00 00 00 00 ff ff 00 f0, no next points, 0x0D03 00 00 00 3f 00 ff ff
    # 00 00, but the compass kept, as it has its own source. It does not
    # release the pane (nav-operation and tbt-alive): stock does that apart.
    end:
      - { msg: tbt-turn, set: { maneuver: none, side_street: 0, direction: 0, distance: null, unit: m, side_street_combi: 0, bar: null, distance_tenths: 0 } }
      - { msg: tbt-points, set: { p1_unit: null, p1_tenths: null, p1_distance: null, p2_unit: null, p2_tenths: null, p2_distance: null, p3_unit: null, p3_tenths: null, p3_distance: null } }
      - { msg: cluster-sub-info, set: { remaining_unit: m, remaining_tenths: 0, eta_hour: 0, eta_minute: 0, time_type: 0, remaining: null, time_format: 0, est_point_type: 0 } }
    status: code
    ref: "stock ClusterService$NaviCluster TBTInfo packer (byte 0 straight from the caller); GPM GpmNaviTBTManager.releaseGuidance; nemesis-report worked example \"turn right, 0.3 km\""

  # TBTSubInfo2C, func 0x0D02: the distances to the next three points.
  - name: tbt-points
    dir: to_micom
    hdr: cluster_tx
    cmd: 0x02
    length: 9
    fields:
      - { name: p1_unit,     off: 0, bits: "7:4", enum: distance_unit, invalid: 15 }
      - { name: p1_tenths,   off: 0, bits: "3:0", max: 9, invalid: 15 }
      - { name: p1_distance, off: 1, type: u16, invalid: 0xffff }
      - { name: p2_unit,     off: 3, bits: "7:4", enum: distance_unit, invalid: 15 }
      - { name: p2_tenths,   off: 3, bits: "3:0", max: 9, invalid: 15 }
      - { name: p2_distance, off: 4, type: u16, invalid: 0xffff }
      - { name: p3_unit,     off: 6, bits: "7:4", enum: distance_unit, invalid: 15 }
      - { name: p3_tenths,   off: 6, bits: "3:0", max: 9, invalid: 15 }
      - { name: p3_distance, off: 7, type: u16, invalid: 0xffff }
    every: 1s
    timeout: 30s
    end:
      - { msg: tbt-points, set: { p1_unit: null, p1_tenths: null, p1_distance: null, p2_unit: null, p2_tenths: null, p2_distance: null, p3_unit: null, p3_tenths: null, p3_distance: null } }
    status: code
    ref: "stock ClusterService$NaviCluster TBTSubInfo2C packer"

  # TBTSubInfo, func 0x0D03: the route's remaining distance and ETA, and the
  # compass. Every field at its default with the compass at 105 degrees is
  # the captured ack frame; with no compass, the code tbt-sub-info frame.
  # While active it owns ack (and so tbt-sub-info, which replaces it).
  - name: cluster-sub-info
    dir: to_micom
    hdr: cluster_tx
    cmd: 0x03
    length: 9
    fields:
      - { name: remaining_unit,   off: 0, bits: "7:4", enum: distance_unit, invalid: 15 }
      - { name: remaining_tenths, off: 0, bits: "3:0", max: 9, invalid: 15 }
      - { name: eta_hour,         off: 1, max: 23, invalid: 0xff }
      - { name: eta_minute,       off: 2, max: 59, invalid: 0xff }
      - { name: compass,          off: 3, scale: 7.5, min: 0, max: 360, invalid: 0x3f }   # heading, degrees
      # Stock code: 0 no time, 1 ETA. The default is the captured 3 (the
      # stock system's idle frame on the wire), meaning unknown.
      - { name: time_type,        off: 4, default: 3 }
      - { name: remaining,        off: 5, type: u16, invalid: 0xffff }
      # Stock code: 0 none, 1 12 h, 2 24 h; the captured 3 likewise.
      - { name: time_format,      off: 7, default: 3 }
      - { name: est_point_type,   off: 8, invalid: 0xff }
    every: 600ms       # the captured ack rate
    owns: ack
    timeout: 5s
    status: code
    ref: "stock ClusterService$NaviCluster TBTSubInfo packer; the captured ack frame"

  # OperationStatus, func 0x0D11: whether a navigation owns the cluster's
  # pane (1), with or without a route; 0 releases it. Stock claims with
  # tbt-alive 1 then this 1, and releases with tbt-alive 0 then this 0.
  - name: nav-operation
    dir: to_micom
    hdr: cluster_tx
    cmd: 0x11
    length: 1
    fields:
      - { name: status, off: 0, enum: operation }
    end:
      - { msg: nav-operation, set: { status: released } }
    status: code
    ref: "stock ClusterService$NaviCluster.sendOperationStatus (1 byte), Navigation$Func OPERATION_STATUS 0x11; GPM claimCluster/onStatus; DiPO u.java claim and release"

  # ALIVE, func 0x0D0E: the navigation is alive, 1 byte.
  - name: tbt-alive
    dir: to_micom
    hdr: cluster_tx
    cmd: 0x0e
    length: 1
    fields:
      - { name: alive, off: 0, type: bool }
    end:
      - { msg: tbt-alive, set: { alive: false } }
    status: code
    ref: "stock ClusterService$NaviCluster.sendAlive (mIsAlive 1/0), Navigation$Func ALIVE 0x0e"

  # DAY_NIGHT_STATUS, func 0x0D0F: the navigation's look, 1 byte.
  - name: cluster-day-night
    dir: to_micom
    hdr: cluster_tx
    cmd: 0x0f
    length: 1
    fields:
      - { name: mode, off: 0, enum: day_night }
    status: code
    ref: "stock ClusterService$NaviCluster.sendDayNight (mIsNight 1/0), Navigation$Func DAY_NIGHT_STATUS 0x0f"

  # Battery conditioning: what stock's navigation tells the car when it
  # routes to a fast charger, so the BMS warms the pack. Stock sends the
  # distance and time to the charger, then the station event; it follows
  # each station event with 07 07 (invalid) 120 ms later, a pulse. The BMS
  # decides: READY, conditioning enabled in the car's EV settings, the pack
  # cold. Gen5W community tooling (Launchpad) starts with 9 km, 18 min and
  # station 2/3, refreshes the two every 5 s, and stops with 2047 km,
  # 1023 min and station 0/0.
  - name: batt-cond-route-distance
    dir: to_micom
    hdr: poll_tx
    cmd: 0x66
    length: 2
    fields:
      - { name: km, off: 0, type: u16, max: 2047 }   # 2047: none
    on_change: false
    status: code
    ref: "stock HEVService.setBattCondRouteDis: sendPacket(0x88, 0x0c, 0x0c66, [hi, lo])"
  - name: batt-cond-remain-time
    dir: to_micom
    hdr: poll_tx
    cmd: 0x65
    length: 2
    fields:
      - { name: minutes, off: 0, type: u16, max: 1023 }   # 1023: none
    on_change: false
    status: code
    ref: "stock HEVService.setBattCondRemainTime: sendPacket(0x88, 0x0c, 0x0c65, [hi, lo])"
  - name: batt-cond-ev-station
    dir: to_micom
    hdr: poll_tx
    cmd: 0x68
    length: 2
    fields:
      - { name: flag, off: 0, max: 15 }   # 2 start, 0 stop, 7 invalid
      - { name: type, off: 1, max: 15 }   # 3 start, 0 stop, 7 invalid
    on_change: false
    status: code
    ref: "stock HEVService.setBattCondEvStation: sendPacket(0x88, 0x0c, 0x0c68, [flag & 0xf, type & 0xf]), then HEVService$6 [7, 7] after 120 ms; github.com/paytondevs/gen5w-preconditioning PreconditioningProfile"

  # Power and ACC, from the micom firmware (CV_E.USA.S5W_M.V002.208) in
  # emulation and disassembly; not yet seen from a car. The ACC-off timeline
  # and a clean shutdown are in docs/messages.md ("Power").
  # 0x8108 on every power state change: [00, state, 00] going down,
  # [01, 05] when ACC comes back.
  - name: "Power state"
    dir: from_micom
    hdr: system_rx
    cmd: 0x08
    length: 3
    when: [ { off: 0, eq: 0x00 } ]
    fields:
      - { name: "Power state", off: 1, enum: power_state }
    status: code
    ref: "micom firmware FUN_0006ee40; micom-run ACC off to state 0"
  - name: "Power state (ACC on)"
    dir: from_micom
    hdr: system_rx
    cmd: 0x08
    length: 2
    when: [ { off: 0, eq: 0x01 } ]
    fields:
      - { name: "Power state", off: 1, enum: power_state }
    status: code
    ref: "micom-run: ff 01 8a 01 81 08 00 03 01 05 fb on ACC on"
  # 0x8133: the ACC edge, before the 0x8108 of the same change.
  - name: "ACC edge"
    dir: from_micom
    hdr: system_rx
    cmd: 0x33
    length: 1
    fields:
      - { name: "ACC", off: 0, enum: acc_edge }
    status: code
    ref: "micom-run: 0x8133 [01] on ACC off, [02] on ACC on"
  # 0x810a-0x810d are not ACC or ignition (ACC is reported only by 0x8108
  # and 0x8133). Their triggers are CAN signals not yet identified.
  - name: "CAN rheostat flag"
    dir: from_micom
    hdr: system_rx
    cmd: 0x0a
    length: 1
    fields:
      # Sets the micom's "use the CAN rheostat, not the stored one" bit; the
      # caller is indirect (vehicle or ignition on, a guess).
      - { name: "CAN rheostat selected", off: 0 }
    status: code
    ref: "micom firmware FUN_00062f9c"
  - name: "CAN rheostat state"
    dir: from_micom
    hdr: system_rx
    cmd: 0x0b
    length: 1
    fields:
      # The flag above and a CAN value (0x40016cc6 == 1), debounced 0.5 s.
      - { name: "CAN rheostat active", off: 0 }
    status: code
    ref: "micom firmware, 0x810b sender"
  - name: "Flag 0x810c"
    dir: from_micom
    hdr: system_rx
    cmd: 0x0c
    length: 1
    fields:
      - { name: "Flag 0x810c", off: 0 }   # always 0 on this build (FUN_00073e46)
    status: code
    ref: "micom firmware FUN_00073e46"
  # Stock's SYS_ILLUMINATION_STATUS_M: any non-zero is day ("illuminate
  # on"), 0 night. The micom sends NOT(CAN 0x11f == 1), on change only;
  # stock seeds the state from the 0x8101 boot record (below). Stock's dim
  # mode overrides it: day and night force it, auto and manual follow it.
  - name: "Illumination"
    dir: from_micom
    hdr: system_rx
    cmd: 0x0d
    length: 1
    fields:
      - { name: "Illumination", off: 0, enum: illumination }
    status: code
    ref: "stock SystemService/VideoSetupService SYS_ILLUMINATION_STATUS_M; micom firmware 0x810d sender; micom-run"
  # Stock's InitialCarInfo: the micom's answer to boot-mode-request (it
  # never sends it unasked), 150 bytes. Byte 4 is the illumination from
  # the same CAN bit as 0x810d, byte 0x12 the dim mode; the rest is not
  # decoded. Seen live: night gave 00 at byte 4.
  - name: "Boot record"
    dir: from_micom
    hdr: system_rx
    cmd: 0x01
    min_length: 0x13
    fields:
      - { name: "Boot reason", off: 0 }
      - { name: "Illumination", off: 4, enum: illumination }
      - { name: "Dim mode", off: 0x12, enum: dim_mode }
    status: captured
    ref: "stock SystemService requestBootMode / InitialCarInfo; micom firmware 0x0101 handler (0x7767a: byte 4 at 0x77884, dim mode config 0xb7 at 0x77986); captured 2026-11-08 in reply to boot-mode-request"
  # Stock's SYS_RHEOSTAT_M. Bits 1 and 2 also toggled with the washer:
  # not explained.
  - name: "Rheostat level"
    dir: from_micom
    hdr: system_rx
    cmd: 0x45
    min_length: 1
    fields:
      - { name: "Rheostat level", off: 0 }
    status: code
    ref: "stock SYS_RHEOSTAT_M (func 0x8145)"
  # The 12 V battery, stock's battSoc; also on the body node below.
  - name: "System 0x819B"
    dir: from_micom
    hdr: system_rx
    cmd: 0x9b
    min_length: 8
    fields:
      - { name: "12 V battery charge", off: 7, unit: " %" }
    status: code
    ref: "stock battSoc, func 0x819b byte 7"
  - name: "12 V battery"
    dir: from_micom
    hdr: body
    cmd: 0x14
    min_length: 1
    fields:
      - { name: "12 V battery charge (body)", off: 0, unit: " %" }
    status: code
    ref: "stock BODY Batt_SoC"
  # Replies of the display node to SoC queries.
  - name: "Display 0x880C"
    dir: from_micom
    hdr: display_rx
    cmd: 0x0c
    min_length: 1
    fields:
      - { name: "Display 0x880C", off: 0 }   # RAM 0x400118e8, meaning unknown; 02 in emulation
    status: code
    ref: "micom-run: 0x080C [00] answered ff 08 8c 01 88 0c 00 02 02 fe"
  - name: "Rheostat"
    dir: from_micom
    hdr: display_rx
    cmd: 0x10
    min_length: 1
    fields:
      - { name: "Rheostat step", off: 0 }   # 0-21; 20 in emulation
    status: code
    ref: "micom-run: 0x0810 [00] answered 14"
  - name: "Display 0x8813"
    dir: from_micom
    hdr: display_rx
    cmd: 0x13
    min_length: 1
    fields:
      - { name: "Display 0x8813", off: 0 }   # RAM 0x400172a0; 0x32 in emulation
    status: code
    ref: "micom-run: 0x0813 [00] answered 32"
  # The answer to stock's current-brightness request (0x081B): the
  # brightness, u16, then, by stock, the light sensor's u16, not decoded
  # here as it may be absent. Sent only with the "new display option"
  # (0x40011990 & 0x60000).
  - name: "Current brightness"
    dir: from_micom
    hdr: display_rx
    cmd: 0x1b
    min_length: 2
    fields:
      - { name: "Current brightness", off: 0, type: u16 }
    status: code
    ref: "stock current brightness request 0x081B and its reply; micom firmware 0x081B handler"

  # Driving state the micom relays, found by lining snapshots up with an
  # OBD2 logger on a drive (r >= 0.99) and by labelled toggles.
  # Byte 1 is the speed in 0.5 mph (raw 134 = 67 mph; motor rpm was
  # 61.5 x raw + 114). Byte 0 is unknown.
  - name: "Vehicle speed"
    dir: from_micom
    hdr: body
    cmd: 0x20
    min_length: 2
    fields:
      - { name: "Vehicle speed",       off: 1, scale: 0.804672, unit: " km/h" }   # 0.5 mph
      - { name: "Vehicle speed (mph)", off: 1, scale: 0.5,      unit: " mph" }
    status: captured
    ref: "drive 2026-11, micomd snapshots against Car Scanner OBD2 speed (r >= 0.99)"
  # The state of charge as the car displays it, and the remaining energy.
  # 54-59 kWh seen.
  - name: "Battery"
    dir: from_micom
    hdr: cluster_rx
    cmd: 0x47
    min_length: 4
    fields:
      - { name: "State of charge",          off: 0, scale: 0.5,   unit: " %" }
      # Signed is a guess: only 20-24 °C seen.
      - { name: "Battery minimum temperature", off: 1, type: i8, unit: " °C" }
      - { name: "Battery remaining energy", off: 2, type: u16, scale: 0.002, unit: " kWh" }
    status: captured
    ref: "drive 2026-11, micomd snapshots against Car Scanner OBD2 displayed SoC, minimum battery temperature (r 0.998) and remaining energy (r >= 0.99)"
  # Battery conditioning running: 1 from 68 s after micom-precondition's
  # start until its stop, with the EV power block's battery heater byte
  # 0 -> 53-54 -> 0 and 0c88018c 54 byte 0 bit 4 over the same window.
  - name: "Battery conditioning"
    dir: from_micom
    hdr: body
    cmd: 0x53
    length: 1
    fields:
      - { name: "Battery conditioning", off: 0, type: bool }
    status: captured
    ref: "micom-precondition test 2026-11-09 00:16-00:18, parked READY, pack 18 °C"
  # Active while cruise control holds the speed: it followed off, resume,
  # off and set exactly; arming cruise does not change it. The set speed,
  # LKAS and the following distance are not on this link.
  - name: "Cruise control"
    dir: from_micom
    hdr: cluster_rx
    cmd: 0x46
    min_length: 1
    fields:
      - { name: "Cruise control", off: 0, enum: cruise }
    status: captured
    ref: "drive 2026-11, labelled cruise off/resume/off/set toggles"
  # The rest checked against the car's own cluster, while charging.
  # Distance to empty, in both units; byte 0 unknown (02 seen).
  - name: "Range"
    dir: from_micom
    hdr: cluster_rx
    cmd: 0x43
    min_length: 5
    fields:
      - { name: "Range",        off: 3, type: u16, unit: " km" }
      - { name: "Range (mi)",   off: 1, type: u16, unit: " mi" }
    status: captured
    ref: "02 00 75 00 bc against the cluster's 117 mi"
  - name: "Odometer"
    dir: from_micom
    hdr: body
    cmd: 0x22
    min_length: 3
    fields:
      - { name: "Odometer", start_bit: 7, bit_length: 24, scale: 0.1, unit: " km" }
    status: captured
    ref: "06 c4 0c (44340.4 km) against the cluster's 27551 mi"
  # °F + 40 in one byte.
  - name: "Outdoor temperature"
    dir: from_micom
    hdr: climate_panel
    cmd: 0x02
    min_length: 1
    fields:
      - { name: "Outdoor temperature",      off: 0, scale: 0.5555555555555556, offset: -40, unit: " C" }
      - { name: "Outdoor temperature (F)",  off: 0, offset: -40, unit: " F" }
    status: captured
    ref: "5e against the cluster's 54 F"

  # The backlight. Off from power-up until the first on; on is refused while
  # the supply is low. The micom writes a config byte to EEPROM on every
  # frame (0x230), so it is spaced like a persistent one, but it is not
  # persistent: the SoC must send it after each micom start.
  - name: backlight
    dir: to_micom
    hdr: display_tx
    cmd: 0x02
    length: 1
    fields:
      - { name: "on", off: 0, bits: "0", type: bool }
    on_change: false     # every input sends: the micom forgets it on reset
    min_interval: 1s
    status: code
    ref: "micom-run: ff 8c 08 01 08 02 00 02 01 73 on, ... 00 72 off; eMIOS0 ch 6 PWM"
  # The shutdown acks, 0x0109. Latched by the micom and not cleared on ACC
  # on, so a stale ack cuts the next ACC-off cycle short: each is sent only
  # while the last power state received is the one it answers.
  - name: shutdown-ack
    dir: to_micom
    hdr: system_tx
    cmd: 0x09
    length: 1
    fields:
      - { name: stage, off: 0, enum: shutdown_ack }
    on_change: false     # an ack repeated is still an ack
    requires:
      - { if: { stage: power_off_request }, field: "Power state", in: [ power_off_request ] }
      - { if: { stage: rail_off },          field: "Power state", in: [ rail_off ] }
    status: code
    ref: "micom-run: 0x0109 [01] ff 8a 01 01 01 09 00 02 01 7e, [02] ... 02 7d; status bits b8, b12"

  # Persistent: the micom writes each to EEPROM (block A 0x100 and backup B
  # 0x300) on every frame. Needs -allow-persistent.
  - name: backlight-dim-mode
    dir: to_micom
    hdr: display_tx
    cmd: 0x01
    length: 1
    fields:
      - { name: mode, off: 0, enum: dim_mode }
    persistent: true     # EEPROM 0x1b7, 0x230, 0x286
    min_interval: 1s
    status: code
    ref: "stock MON_SET_DIMMING_MODE_C (0 auto, 1 daylight, 2 night, 3 manual); micom firmware 0x0801 handler; micom-run EEPROM trace"
  # Stock's dimming brightness: the level of one period; auto applies at
  # once, day and night at the next dim mode.
  - name: backlight-period-level
    dir: to_micom
    hdr: display_tx
    cmd: 0x07
    length: 2
    fields:
      - { name: period, off: 0, enum: period }
      - { name: level,  off: 1, max: 10 }   # the micom does not check: 11 reads the next table row
    persistent: true     # EEPROM 0x1b8 day, 0x1b9 night
    min_interval: 1s
    status: code
    ref: "stock dimming brightness [period, level]; micom firmware 0x0807 handler; micom-run EEPROM trace"
  # Stock's user brightness: the manual level, per mille, applied at once in dim mode manual. Stock
  # sends it from a slider: min_interval keeps that from wearing the EEPROM.
  - name: backlight-manual-level
    dir: to_micom
    hdr: display_tx
    cmd: 0x1a
    length: 2
    fields:
      - { name: level, off: 0, type: u16, min: 10, max: 1000 }
    persistent: true     # EEPROM 0x286
    min_interval: 1s
    status: code
    ref: "stock user brightness; micom firmware 0x081A handler; micom-run EEPROM trace"

# The power and backlight tables of the micom firmware.
enums:
  power_state: { rail_off: 0, power_off_request: 1, bus_sleep: 3, acc_off_hold: 4, acc_on: 5, stop: 6, standby: 7 }
  acc_edge: { "off": 1, "on": 2 }
  shutdown_ack: { power_off_request: 1, rail_off: 2 }
  dim_mode: { auto: 0, day: 1, night: 2, manual: 3 }
  period: { day: 1, night: 2 }
  cruise: { inactive: 0, active: 2 }
  illumination: { night: 0, day: 1 }   # stock: any non-zero is day
  operation: { released: 0, operating: 1 }   # 2 and 3 exist; their meaning is unknown
  day_night: { day: 0, night: 1 }
