# Kia EV6 (project CV), Mobis DAudio Plus Gen5 Wide. Every value was seen on
# this car, by pressing the control or in a capture, unless its status says
# otherwise. The send entries and key bindings are those the device's systemd
# unit passes as -allow and -keymap (pmaports device-mobis-g5w).
schema: 1
name: kia-ev6-gen5w
extends: hkmc-gen5w-ev
title: "Kia EV6 (CV), Mobis DAudio Plus Gen5 Wide"

match:
  cmdline:
    # The stock bootloader's vehicle code for this car. country_info=0x01
    # (USA) was on the same command line; left out so an EV6 of another
    # region matches until it shows a difference.
    vehicle_info: 0xcc
  status: captured
  ref: "stock /proc/cmdline, 2026-11-07 (ro.product.device=wp_daudioplus_cvev_us)"

expect:
  climate_variant: 2   # persist.sys.climate.variant on the stock unit
  amp_type: 2          # persist.sys.amptype on the stock unit (0 is the internal amp)

# The micom relays these from other nodes of the car, each with its own header.
headers:
  keys:          { hdr: "07 84 01 87", dir: from_micom, status: captured }
  climate_panel: { hdr: "43 c2 00 c3", dir: from_micom, status: captured }
  seat_node:     { hdr: "55 ca 00 d5", dir: from_micom, status: captured, ref: "seat heat; the driver's door switches" }
  body:          { hdr: "44 c1 00 c4", dir: from_micom, status: captured, ref: "doors; repeats seat heat and windows" }
  camera:        { hdr: "01 c4 01 81", dir: from_micom, status: captured }
  cluster_rx:    { hdr: "0d 8f 01 8d", dir: from_micom, status: captured, ref: "battery and cruise; cluster_tx's reverse" }
  # Not a BMS broadcast: the micom relays diagnostic (OBD-II / UDS) replies
  # it sees on the bus (stock passes them raw to its hscand), present only
  # while an external tester polls.
  diag_relay:    { hdr: "40 c7 80 c0", dir: from_micom, status: captured, ref: "stock HscanMicomService (rcvId 0xc7); seen only in logs taken while Car Scanner polled over OBD" }
  poll_tx:       { hdr: "88 0c 01 0c", dir: to_micom, status: captured }
  # ClusterService.sendPacket: sndId 0x8f, rcvId 0x0d, type 1, funcH 0x0d.
  cluster_tx:    { hdr: "8f 0d 01 0d", dir: to_micom, status: captured, ref: "the ack profile frame; stock ClusterService" }
  status_tx:     { hdr: "c3 4d 00 4d", dir: to_micom, status: captured }
  clock_tx:      { hdr: "c2 43 00 43", dir: to_micom, status: captured }
  # The micom's display node (backlight): micom firmware, in emulation.
  display_rx:    { hdr: "08 8c 01 88", dir: from_micom, status: code, ref: "EV6 micom firmware V002.208, firmware emulation" }
  display_tx:    { hdr: "8c 08 01 08", dir: to_micom, status: code, ref: "EV6 micom firmware V002.208, firmware emulation" }
  # A node not otherwise captured: only ever seen reporting the gear.
  gear_node:     { hdr: "50 c4 00 d0", dir: from_micom, status: captured, ref: "micomd capture, 2026-11-10, P/D/N/R shifts" }
  # Stock's start-up reads, never sent by micomd unless asked (the
  # -*-status-request flags): the body's B-CAN validity check (BCMService on
  # rcvId 0x8e), its bulk request, and the settings' (USMService).
  tele_tx:       { hdr: "8e 0b 01 0b", dir: to_micom,   status: code, ref: "stock BCMService CAN validity requests (sendPacket(0x8e, 0x0b, func 0x0bxx))" }
  tele_rx:       { hdr: "0b 8e 01 8b", dir: from_micom, status: captured, ref: "stock BCMService 0x8bc3/0x8bc7; 0x8bc3 seen unasked" }
  body_tx:       { hdr: "c1 44 00 44", dir: to_micom,   status: code, ref: "stock BCMService sendPacket(0xc1, 0x44, 0, 0x44, ordinal)" }
  usm_tx:        { hdr: "92 11 01 11", dir: to_micom,   status: code, ref: "stock USMService sendPacket(0x92, 0x11, func 0x11xx)" }
  usm_rx:        { hdr: "11 92 01 91", dir: from_micom, status: captured, ref: "stock USMService; deltas seen at IGN on" }

keys:
  frame: { hdr: keys, cmd: 0x01 }   # Func 0x8701
  # Labels from pressing each; the keys are the LIVI mapping of the unit's
  # -keymap (LIVI's scancode table has no phone or voice keys, so those are
  # F13-F22). They are injected only with -keys; -keymap still wins.
  push:
    - { type: 0, code: 1,  label: "Volume knob",       key: KEY_MUTE }
    - { type: 0, code: 2,  label: "Seek <",            key: KEY_PREVIOUSSONG }
    - { type: 0, code: 3,  label: "Track >",           key: KEY_NEXTSONG }
    - { type: 0, code: 4,  label: "Map",               key: KEY_F17 }
    - { type: 0, code: 5,  label: "Nav",               key: KEY_HOME }
    - { type: 1, code: 1,  label: "Tune knob",         key: KEY_ENTER }
    - { type: 1, code: 2,  label: "Radio",             key: KEY_F18 }
    - { type: 1, code: 3,  label: "Media",             key: KEY_F19 }
    - { type: 1, code: 4,  label: "Star",              key: KEY_F20 }
    - { type: 1, code: 5,  label: "Setup",             key: KEY_F22 }
    # The steering wheel.
    - { type: 2, code: 2,  label: "Wheel up",          key: KEY_NEXTSONG }
    - { type: 2, code: 3,  label: "Wheel down",        key: KEY_PREVIOUSSONG }
    - { type: 2, code: 4,  label: "Wheel mode",        key: KEY_PLAYPAUSE }
    - { type: 2, code: 5,  label: "Wheel volume push", key: KEY_MUTE }
    - { type: 2, code: 6,  label: "Wheel volume up",   key: KEY_VOLUMEUP }
    - { type: 2, code: 7,  label: "Wheel volume down", key: KEY_VOLUMEDOWN }
    - { type: 2, code: 8,  label: "Wheel voice",       key: KEY_F13 }
    - { type: 2, code: 10, label: "Wheel call",        key: KEY_F14 }
    - { type: 2, code: 11, label: "Wheel star",        key: KEY_F21 }
  # A knob turn: the high nibble of the second byte 1 up, 0 down, the low
  # nibble the detents turned (stock KnobKeyFromMicom), one tap each. A knob
  # is named by its one-detent frame, code 1.
  knobs:
    - { type: 8, code: 1, label: "Tune knob",   up: KEY_F15,      down: KEY_F16 }
    - { type: 9, code: 1, label: "Volume knob", up: KEY_VOLUMEUP, down: KEY_VOLUMEDOWN }

signals:
  # The climate panel. One change arrives as a burst of fields, 1b 01 ... 1b 00.
  - name: climate-burst
    hdr: climate_panel
    cmd: 0x1b
    burst: { begin: 0x01 }
    lines: { 0x01: "Climate update begins" }
    unknown_line: "Climate update ends"
  # Set points, each in both units: 0x05 and 0x09 Celsius, raw / 2 + 14
  # (state in half degrees, raw + 28), 0x07 and 0x0b Fahrenheit, raw + 56.
  # 00 is the zone off (the passenger's with driver only), 01 LO, fe HI.
  - name: climate-driver-set-c
    hdr: climate_panel
    cmd: 0x05
    label: "Climate driver set point"
    number: { add: 28, div: 2, range: [2, 36], format: "%g C" }
    values: &setc { 0x00: { text: "off", state: 0 }, 0x01: { text: "LO", state: -1 }, 0xfe: { text: "HI", state: -2 } }
    state: driver_set_half_c
    ref: "DATCService DrTempDispC / PsTempDispC (C = raw * 0.5 + 14; 1 LO, 254 HI)"
  - name: climate-driver-set
    hdr: climate_panel
    cmd: 0x07
    label: "Climate driver set point"
    number: { add: 56, range: [2, 36], format: "%d F" }
    values: *setc
    state: driver_set_f
  - name: climate-passenger-set-c
    hdr: climate_panel
    cmd: 0x09
    label: "Climate passenger set point"
    number: { add: 28, div: 2, range: [2, 36], format: "%g C" }
    values: *setc
    state: passenger_set_half_c
  - name: climate-passenger-set
    hdr: climate_panel
    cmd: 0x0b
    label: "Climate passenger set point"
    number: { add: 56, range: [2, 36], format: "%d F" }
    values: *setc
    state: passenger_set_f
  - name: climate-airflow
    hdr: climate_panel
    cmd: 0x0d
    label: "Climate airflow"
    enum: { 0: "off", 1: "face", 2: "face and feet", 3: "feet", 4: "feet and defrost", 5: "defrost", 8: "auto" }
    state: airflow
  - { name: climate-auto,        hdr: climate_panel, cmd: 0x0f, label: "Climate auto",        flag: { on: 1, off: 0 }, state: auto }
  - { name: climate-ac,          hdr: climate_panel, cmd: 0x11, label: "Climate A/C",         flag: { on: 1, off: 0 }, state: ac }
  - name: climate-fan
    hdr: climate_panel
    cmd: 0x15
    label: "Climate fan"
    fan: { off: 0x00, auto: 0x0a, levels: [2, 9] }   # levels 1 to 8
    state: fan
  - { name: climate-driver-only, hdr: climate_panel, cmd: 0x19, label: "Climate driver only", flag: { on: 1, off: 0 }, state: driver_only }
  # Recirculation off is the car's 2.
  - { name: climate-recirculation, hdr: climate_panel, cmd: [0x1e, 0x43], label: "Climate recirculation", flag: { on: 1, off: 2 }, state: recirculation }
  - name: climate-zones
    hdr: climate_panel
    cmd: 0x27
    label: "Climate zones"
    flag: { on: 1, off: "*", on_text: "synced", off_text: "independent" }
    state: zones_synced
  - { name: climate-heat, hdr: climate_panel, cmd: 0x33, label: "Climate heat", flag: { on: 1, off: 0 } }
  # The climate system on or off (stock DATC_OpSts: 0 power off, 1 on,
  # 2 off), and the panel's climate key asking the HU for its climate
  # screen (DATC_ClimateScnDisp, 1).
  - { name: climate-on,  hdr: climate_panel, cmd: 0x12, label: "Climate", flag: { on: 1, off: "*" }, state: "on", ref: "stock DATCService DATC_OpSts; 00 and 01 seen" }
  - { name: climate-key, hdr: climate_panel, cmd: 0x16, label: "Climate key", flag: { on: 1, off: 0, on_text: "pressed", off_text: "released" }, status: code, ref: "stock DATCService DATC_ClimateScnDisp -> the climate screen" }
  - name: climate-auto-level
    hdr: climate_panel
    cmd: 0x4f
    label: "Climate auto level"
    number: { add: -1, format: "%d", wrap: true }   # 00 reads as 255, as it always did
    values: { 0x01: "off" }
  - name: climate-auto-level-inverse
    hdr: climate_panel
    cmd: 0x50
    label: "Climate auto level (inverse)"
    number: { mul: -1, add: 5, format: "%d" }
    values: { 0x01: "off" }

  # Seat heat: 02 off, 06 to 08 levels 1 to 3; repeated on the body node.
  # Read from the first byte whatever the length (len: 0), as it always was.
  - { name: seat-heat-driver,            hdr: seat_node, cmd: 0x20, len: 0, label: "Seat heat, driver",             number: &seat { add: -5, range: [6, 8], format: "heat level %d" }, values: &seatoff { 0x02: { text: "off", state: 0 } }, state: driver_seat_heat }
  - { name: seat-heat-passenger,         hdr: seat_node, cmd: 0x21, len: 0, label: "Seat heat, passenger",         number: *seat, values: *seatoff, state: passenger_seat_heat }
  - { name: seat-heat-driver-repeat,     hdr: body,      cmd: 0x19, len: 0, label: "Seat heat, driver (repeat)",   number: *seat, values: *seatoff, state: driver_seat_heat }
  - { name: seat-heat-passenger-repeat,  hdr: body,      cmd: 0x1b, len: 0, label: "Seat heat, passenger (repeat)",number: *seat, values: *seatoff, state: passenger_seat_heat }
  # The rear seats', on the body node beside the front ones (stock
  # C_RLSeatHeatState, C_RRSeatHeatState), read as the front ones: never
  # seen, so the levels are a guess.
  - { name: seat-heat-rear-left,  hdr: body, cmd: 0x1d, len: 0, label: "Seat heat, rear left",  number: *seat, values: *seatoff, status: code, ref: "stock BODY C_RLSeatHeatState" }
  - { name: seat-heat-rear-right, hdr: body, cmd: 0x1f, len: 0, label: "Seat heat, rear right", number: *seat, values: *seatoff, status: code, ref: "stock BODY C_RRSeatHeatState" }
  # The steering wheel's heat (C_StrgWhlHeatedState; its levels are not
  # known, 0 is likely off) and the rear defroster's relay (C_DefoggerRly).
  - { name: steering-wheel-heat, hdr: body, cmd: 0x0d, label: "Steering wheel heat", number: { format: "state %d" }, status: code, ref: "stock BODY C_StrgWhlHeatedState" }
  - { name: rear-defrost,        hdr: body, cmd: 0x0e, label: "Rear defrost", flag: { on: 1, off: 0 }, state: rear_defrost, status: code, ref: "stock BODY C_DefoggerRly" }

  # Power windows of the driver and front passenger, from the driver's door
  # switches. "Switch" is stock's *WindowActState, the motor's action as the
  # switch drives it. Switch: 0 released, 1 and 2 held down and up, 5 and 6 pressed
  # hard (auto down and up). Position: coarse, 0 closed (top) to 3 fully
  # down, sent when it crosses a step. The rear windows were not tried.
  - { name: window-driver-switch,    hdr: seat_node, cmd: 0x08, label: "Window driver",    enum: &winsw { 0: "switch released", 1: "switch down", 2: "switch up", 5: "switch hard down (auto)", 6: "switch hard up (auto)" }, unknown: "switch code %#02x" }
  - { name: window-passenger-switch, hdr: seat_node, cmd: 0x0b, label: "Window passenger", enum: *winsw, unknown: "switch code %#02x" }
  - { name: window-driver-position,    hdr: seat_node, cmd: 0x06, label: "Window driver",    enum: &winpos { 0: "position 0 of 3 (closed)", 1: "position 1 of 3", 2: "position 2 of 3", 3: "position 3 of 3 (fully down)" }, unknown: "position code %#02x" }
  - { name: window-passenger-position, hdr: seat_node, cmd: 0x09, label: "Window passenger", enum: *winpos, unknown: "position code %#02x" }
  - { name: window-driver-switch-repeat,      hdr: body, cmd: 0x26, label: "Window driver",    enum: *winsw,  unknown: "switch code %#02x",   suffix: " (repeat)" }
  - { name: window-passenger-switch-repeat,   hdr: body, cmd: 0x27, label: "Window passenger", enum: *winsw,  unknown: "switch code %#02x",   suffix: " (repeat)" }
  - { name: window-driver-position-repeat,    hdr: body, cmd: 0x24, label: "Window driver",    enum: *winpos, unknown: "position code %#02x", suffix: " (repeat)" }
  - { name: window-passenger-position-repeat, hdr: body, cmd: 0x25, label: "Window passenger", enum: *winpos, unknown: "position code %#02x", suffix: " (repeat)" }

  # Doors, on the body node: each door has a lock command (00 locked, 01
  # unlocked) and the next number is its open one (01 open, 00 closed).
  # The trunk and the hood have no lock command. Other values: no line.
  - { name: door-front-right-lock, hdr: body, cmd: 0x00, label: "Door front right", enum: &lock { 0: "locked", 1: "unlocked" }, unknown: "" }
  - { name: door-front-right-open, hdr: body, cmd: 0x01, label: "Door front right", enum: &open { 0: "closed", 1: "open" }, unknown: "" }
  - { name: door-driver-lock,      hdr: body, cmd: 0x02, label: "Door driver",      enum: *lock, unknown: "" }
  - { name: door-driver-open,      hdr: body, cmd: 0x03, label: "Door driver",      enum: *open, unknown: "" }
  - { name: door-rear-left-lock,   hdr: body, cmd: 0x04, label: "Door rear left",   enum: *lock, unknown: "" }
  - { name: door-rear-left-open,   hdr: body, cmd: 0x05, label: "Door rear left",   enum: *open, unknown: "" }
  - { name: door-rear-right-lock,  hdr: body, cmd: 0x07, label: "Door rear right",  enum: *lock, unknown: "" }
  - { name: door-rear-right-open,  hdr: body, cmd: 0x08, label: "Door rear right",  enum: *open, unknown: "" }
  - { name: trunk,                 hdr: body, cmd: 0x06, label: "Trunk",            enum: *open, unknown: "" }
  - { name: hood,                  hdr: body, cmd: 0x11, label: "Hood",             enum: *open, unknown: "" }
  # The charge port door (stock CDM_HS_OpnClsState: 1 open, 2 closed,
  # 3 invalid); 02 seen.
  - { name: charge-port,           hdr: body, cmd: 0x49, label: "Charge port",      enum: { 1: "open", 2: "closed" }, unknown: "", ref: "stock BODY CDM_HS_OpnClsState" }

  # The system node's bitmask of what keeps the micom awake: bit 0 always
  # set, then one bit per open door and the trunk. Other bits not known.
  - name: open-doors
    hdr: system_rx
    cmd: 0x2f
    label: "Open doors"
    bits: { always: 0x01, none: "none", names: { 1: "trunk", 2: "front right", 3: "driver", 4: "rear right", 5: "rear left" } }

  # The gear, from a node (gear_node) not seen reporting anything else.
  # Captured directly: every shift among P/D/N/R, 2026-11-10, each more
  # than once. Not sequential (no obvious P=0,R=1,N=2,D=3 or similar); may
  # be a bitmask or a stock enum we have not matched to its source.
  - name: gear
    hdr: gear_node
    cmd: 0x4a
    label: "Gear"
    enum: { 0x00: "park", 0x05: "drive", 0x06: "neutral", 0x07: "reverse" }
    unknown: "code %#02x"

  # Three system frames went 01 together on leaving Park (in D, N and R
  # alike) and 00 back in it. Stock names them: 0x8103 is the driving
  # regulation (the video and keyboard lockout; the micom decides when, the
  # HU applies no speed of its own), 0x819a regulation B (the stricter one
  # tied to P and the parking brake), 0x8126 the gear status, whose stock
  # codes (P 0, D 5, N 6, R 7) this micom does not use: it sends 0 in P and
  # 1 out of it. The body node's 0x10 is the P position (C_PpositionClutch).
  - { name: driving-regulation,   hdr: system_rx, cmd: 0x03, label: "Driving regulation",   flag: { on: 1, off: 0 }, unknown: "", ref: "stock SYS_REGULATOIN_STATUS_M (0x8103) -> RegulationService" }
  - { name: gear-status,          hdr: system_rx, cmd: 0x26, label: "Out of park",          flag: { on: 1, off: 0 }, unknown: "", suffix: " (gear status)", ref: "stock SYS_GEAR_STATUS_M (0x8126); 0/1 on this car" }
  - { name: driving-regulation-b, hdr: system_rx, cmd: 0x9a, label: "Driving regulation B", flag: { on: 1, off: 0 }, unknown: "", ref: "stock SYS_REGULATION_B_STATUS_M (0x819a) -> RegulationService" }
  - { name: out-of-park-body,     hdr: body,      cmd: 0x10, label: "Out of park",          flag: { on: 1, off: 0 }, unknown: "", suffix: " (body node)", ref: "stock BODY C_PpositionClutch" }

  # Reverse specifically (not just out-of-park): on exactly when the camera
  # (rear-camera, code 01) and gear (0x4a = 0x07) are.
  - { name: reverse-active, hdr: system_rx, cmd: 0x1b, label: "Reverse", flag: { on: 1, off: 0 }, unknown: "" }

  # Stock's day or night from the two-way light sensor (0x8195: 1 day, else
  # night). Stock takes it over 0x810d when boot record byte 130 says the
  # sensor is fitted, as on this car; the two flipped together in captures.
  - { name: light-sensor, hdr: system_rx, cmd: 0x95, label: "Light sensor", flag: { on: 1, off: "*", on_text: "day", off_text: "night" }, ref: "stock SYS 0x8195 -> VideoSetupService onIlluminateStatus" }
  # Stock's parking status (0x8129, > 0 applied). Here 0 1-5 s after leaving
  # Park and 1 1-5 s after returning to it, as the electric parking brake
  # releases and applies itself; never seen with the brake set by hand.
  - { name: parking-brake, hdr: system_rx, cmd: 0x29, label: "Parking brake", flag: { on: 1, off: 0 }, unknown: "", ref: "stock SYS_PARKING_STATUS_M (0x8129) -> onParkingStatus" }

  # The rear camera button: 09 when pressed on, 00 off, with cmd 52 (six
  # bytes) following, its last byte 02 on / 00 off; other values unknown.
  # 01 is also "on", from Reverse engaging the camera rather than the
  # button (seen twice with system_rx's reverse-active (0x1b) and gear
  # (0x4a = 0x07)); 01 and 09 read the same here, so this alone cannot tell
  # which of the two turned it on.
  - name: rear-camera
    hdr: camera
    cmd: 0x51
    label: "Rear camera"
    enum: { 0x00: "off", 0x01: "on", 0x09: "on" }
    unknown_line: "Rear camera mode: code %#02x"

# Routine traffic Android sent at a steady rate (logcat MicomD, 2026-10-16),
# sent as seen: what each means, and which the micom needs, is not known. The
# ack payload is not constant: a strace of 2026-11-07 has ack byte 3 = 1d, so
# it carries state. The 1 s status frame Android sent beside them is the
# cluster's position (cluster-position, below): not routine, never replayed.
profile:
  - name: poll        # answered by the 31-byte EV power block
    every: 1s
    frame: "ff 88 0c 01 0c 5c 00 01 2b"
    status: captured
    ref: "logcat MicomD 2026-10-16; strace 2026-11-07 identical"
  # Not an ack: the cluster's TBTSubInfo, func 0x0D03. Remaining distance and
  # ETA (invalid: no route), then the compass, byte 3 = heading / 7.5 degrees.
  # The capture's 0e (105 degrees; 1d in the 2026-11-07 strace) was the car's
  # heading then, so replaying it shows a wrong compass. With -input, the
  # cluster-sub-info message replaces it while a client feeds it.
  - name: ack
    every: 600ms
    frame: "ff 8f 0d 01 0d 03 00 0a ff ff ff 0e 03 ff ff 03 ff 76"
    status: captured
    ref: "logcat MicomD 2026-10-16"
  # The same with the compass as 3f, "no heading", as stock sends when its
  # route ends. Not captured yet: only with -code-profile.
  - name: tbt-sub-info
    every: 600ms
    frame: "ff 8f 0d 01 0d 03 00 0a ff ff ff 3f 03 ff ff 03 ff 47"
    opt_in: code
    replaces: ack
    status: code
    ref: "stock GpmNaviTBTManager / ClusterService$NaviCluster TBTSubInfo packer (hmg_nemesis projection-tbt, stock automotive-service smali)"
  # The two frames whose payload follows the wall clock: only with -clock,
  # as a wrong time may be stored by the car.
  # clock-sec is HEVService's HU clock for the car's charge scheduling:
  # weekday bit, hour << 3, minute, second, 80. The first capture
  # (Friday 20:01) had 04 a0 01, the 2026-11-07 strace (Saturday 20:20:50)
  # 02 a0 14 32 80.
  - name: clock-sec
    every: 1s
    opt_in: clock
    template: "ff 88 0c 01 0c 09 00 06 {weekday_bit} {hour_shl3} {minute} {second} 80 .."
    status: captured
    ref: "logcat MicomD 2026-10-16 20:01:16-17; stock micomd strace 2026-11-07; stock HEVService clock (0x0C09, CAN DB generation 2)"
  - name: clock
    every: 1s
    opt_in: clock
    template: "ff c2 43 00 43 33 00 0c 02 02 {hour} {minute} {second} {month} 01 {year2} {day} 00 02 .."
    status: captured
    ref: "logcat MicomD 2026-10-16 20:01; strace 2026-11-07 matches the unit's clock"

# What the control socket may send when asked, with -allow-variant (inferred
# ones also need -allow-inferred). Captured from the stock micomd (strace on
# its UART) on a source switch: 0x020B AV mute set, 0x0201 mode (0e Media,
# 01 Radio), 0x0203 volume, then 0.2-1.3 s later 0x0238 AV mute release,
# which the micom answers with 0x820B. The 0x0201 modes are stock's
# AudioMode: 01 AM, 0e Bluetooth streaming, 09 USB, 12 MUSIC.
send:
  - { name: av-mute-set,     frame: "ff 85 02 01 02 0b 00 03 02 01 70", status: captured, ref: "stock micomd strace, source switch" }
  - { name: mode-bt-stream,  frame: "ff 85 02 01 02 01 00 03 0e 00 77", status: captured, ref: "stock micomd strace, source switch (Media); AudioMode BT_STREAM" }
  - { name: mode-am,         frame: "ff 85 02 01 02 01 00 03 01 00 78", status: captured, ref: "stock micomd strace, source switch (Radio); AudioMode AM" }
  - { name: av-mute-release, frame: "ff 85 02 01 02 38 00 03 02 00 42", status: captured, ref: "stock micomd strace, source switch" }
  - name: main-volume
    pattern: "ff 85 02 01 02 03 00 02 [00-23] .."
    status: captured
    ref: "stock micomd strace, source switch: levels 22-31"
    note: "levels 0-35: the maximum is unknown, 35 is the cap (the I2S card's control)"
  # The link-up: until a SoC sends it after the micom's own reset, the micom
  # sends the SoC nothing (-boot-mode-request sends it without waiting).
  - { name: boot-mode-request,  frame: "ff 8a 01 01 01 01 00 01 74", status: code, ref: "SystemService.requestBootMode: sendPacket(-118, 1, 0x101), again after 2000 ms; EV6 micom firmware: dispatcher cmd 0x01 sets the link flag and answers 0x8101 with its last mode, mute and volume (firmware emulation)" }
  # Stock's start-up reads (status only; each sent by its own micomd flag):
  # the climate's All_Datc_Req, the body's B-CAN validity check then its
  # All_B_CAN_Req, and the settings' read-all of the units group.
  - { name: climate-status-request, frame: "ff c2 43 00 43 00 00 02 01 3e", status: inferred, ref: "DATCService All_Datc_Req (TE_TX_IL 0x00, [01]) 500 ms after IGN1 on, once more 1.5 s later; answered by All_Datc_Resp (0x00)" }
  - { name: bcan-valid-request,     frame: "ff 8e 0b 01 0b c7 00 02 c7 72", status: inferred, ref: "BCMService B-CAN validity request (0x0bc7 [c7]) at micom ready, every 1 s until 0x8bc7 [1] = 1" }
  - { name: body-status-request,    frame: "ff c1 44 00 44 05 00 01 3a",    status: inferred, ref: "BCMService All_B_CAN_Req (TE_TX_IL 0x05, empty) once B-CAN is valid; answered by ALL_BCM_Resp (0xc40c)" }
  - { name: usm-units-request,      frame: "ff 92 11 01 11 11 00 03 fa fa 7e", status: inferred, ref: "USMService read-all (0x1111 Unit_SET_C_REQ [fa fa]) 2 s after IGN on; answered by 0x9111 with [0] = fa" }
  # Two of HEVService's CAN DB generation > 0 reads (it also reads 0x0c4a-
  # 0x0c52 and 0x0c55): the schedules, otherwise sent only on change.
  - { name: ev-schedule-settings-request, frame: "ff 88 0c 01 0c 53 00 01 24", status: inferred, ref: "HEVService requestInitG3Messages (CAN DB generation > 0, at micom ready): func 0x0c53, empty payload; answered by 0x8c53" }
  - { name: ev-charge-window-request,     frame: "ff 88 0c 01 0c 54 00 01 23", status: inferred, ref: "HEVService requestInitG3Messages (CAN DB generation > 0, at micom ready): func 0x0c54, empty payload; answered by 0x8c54" }
  - { name: mode-usb,           frame: "ff 85 02 01 02 01 00 03 09 00 70", status: inferred, ref: "MicomAudioService audio mode USB" }
  - { name: mode-music,         frame: "ff 85 02 01 02 01 00 03 12 00 6b", status: inferred, ref: "MicomAudioService audio mode MUSIC" }
  - { name: av-mute-release-0b, frame: "ff 85 02 01 02 0b 00 03 02 00 71", status: inferred, ref: "0x020B mute control: AV, RELEASE" }
  - { name: amp-mute-release,   frame: "ff 85 02 01 02 0b 00 03 01 00 72", status: inferred, ref: "0x020B mute control: AMP, RELEASE" }
  - { name: amp-mute-set,       frame: "ff 85 02 01 02 0b 00 03 01 01 73", status: inferred, ref: "0x020B mute control: AMP, SET" }

# The cluster's turn-by-turn guidance and compass, filled in from -input
# (docs/messages.md). Layouts are the stock packers', never captured, so
# status code: they also need -allow-inferred. The 16-bit integers are big
# endian: the micom firmware reads them so (in emulation) before repacking
# them onto CAN.
# Here rather than in the family base because cluster-sub-info owns this
# car's ack profile entry, and tbt-turn's end names it.
messages:
  # TBTInfo, func 0x0D04: the next maneuver.
  - name: tbt-turn
    dir: to_micom
    hdr: cluster_tx
    cmd: 0x04
    length: 8
    fields:
      - { name: maneuver,          off: 0, enum: maneuver }
      - { name: side_street,       off: 1, type: u16, invalid: 0xffff }
      - { name: direction,         off: 3, scale: 7.5, min: 0, max: 360, default: 0 }   # degrees
      - { name: distance,          off: 4, type: u16, invalid: 0xffff }                 # its integer part
      - { name: unit,              off: 6, bits: "7:4", enum: distance_unit, invalid: 15 }
      - { name: side_street_combi, off: 6, bits: "3:0", default: 0 }
      # The progress bar, percent, in tenths. 0xE ("err -2") is not modelled.
      - { name: bar,               off: 7, bits: "7:4", scale: 10, min: 0, max: 100, invalid: 15 }
      - { name: distance_tenths,   off: 7, bits: "3:0", max: 9, invalid: 15 }
    every: 1s          # a guess: stock sends on change
    timeout: 30s
    # Stock's end of route (GPM releaseGuidance: updateTBTInfo(0, 0, 0, 0,
    # -1, 0, 0, 0, -1) and updateTBTSubInfo(0, -1, 0, ...)): 0x0D04
    # 00 00 00 00 ff ff 00 f0, no next points, 0x0D03 00 00 00 3f 00 ff ff
    # 00 00, but the compass kept, as it has its own source. It does not
    # release the pane (nav-operation and tbt-alive): stock does that apart.
    end:
      - { msg: tbt-turn, set: { maneuver: none, side_street: 0, direction: 0, distance: null, unit: m, side_street_combi: 0, bar: null, distance_tenths: 0 } }
      - { msg: tbt-points, set: { p1_unit: null, p1_tenths: null, p1_distance: null, p2_unit: null, p2_tenths: null, p2_distance: null, p3_unit: null, p3_tenths: null, p3_distance: null } }
      - { msg: cluster-sub-info, set: { remaining_unit: m, remaining_tenths: 0, eta_hour: 0, eta_minute: 0, time_type: 0, remaining: null, time_format: 0, est_point_type: 0 } }
    status: code
    ref: "stock ClusterService$NaviCluster TBTInfo packer (byte 0 straight from the caller); GPM GpmNaviTBTManager.releaseGuidance; nemesis-report worked example \"turn right, 0.3 km\""

  # TBTSubInfo2C, func 0x0D02: the distances to the next three points.
  - name: tbt-points
    dir: to_micom
    hdr: cluster_tx
    cmd: 0x02
    length: 9
    fields:
      - { name: p1_unit,     off: 0, bits: "7:4", enum: distance_unit, invalid: 15 }
      - { name: p1_tenths,   off: 0, bits: "3:0", max: 9, invalid: 15 }
      - { name: p1_distance, off: 1, type: u16, invalid: 0xffff }
      - { name: p2_unit,     off: 3, bits: "7:4", enum: distance_unit, invalid: 15 }
      - { name: p2_tenths,   off: 3, bits: "3:0", max: 9, invalid: 15 }
      - { name: p2_distance, off: 4, type: u16, invalid: 0xffff }
      - { name: p3_unit,     off: 6, bits: "7:4", enum: distance_unit, invalid: 15 }
      - { name: p3_tenths,   off: 6, bits: "3:0", max: 9, invalid: 15 }
      - { name: p3_distance, off: 7, type: u16, invalid: 0xffff }
    every: 1s
    timeout: 30s
    end:
      - { msg: tbt-points, set: { p1_unit: null, p1_tenths: null, p1_distance: null, p2_unit: null, p2_tenths: null, p2_distance: null, p3_unit: null, p3_tenths: null, p3_distance: null } }
    status: code
    ref: "stock ClusterService$NaviCluster TBTSubInfo2C packer"

  # TBTSubInfo, func 0x0D03: the route's remaining distance and ETA, and the
  # compass. Every field at its default with the compass at 105 degrees is
  # the captured ack frame; with no compass, the code tbt-sub-info frame.
  # While active it owns ack (and so tbt-sub-info, which replaces it).
  - name: cluster-sub-info
    dir: to_micom
    hdr: cluster_tx
    cmd: 0x03
    length: 9
    fields:
      - { name: remaining_unit,   off: 0, bits: "7:4", enum: distance_unit, invalid: 15 }
      - { name: remaining_tenths, off: 0, bits: "3:0", max: 9, invalid: 15 }
      - { name: eta_hour,         off: 1, max: 23, invalid: 0xff }
      - { name: eta_minute,       off: 2, max: 59, invalid: 0xff }
      - { name: compass,          off: 3, scale: 7.5, min: 0, max: 360, invalid: 0x3f }   # heading, degrees
      # Stock code: 0 no time, 1 ETA. The default is the captured 3 (the
      # stock system's idle frame on the wire), meaning unknown.
      - { name: time_type,        off: 4, default: 3 }
      - { name: remaining,        off: 5, type: u16, invalid: 0xffff }
      # Stock code: 0 none, 1 12 h, 2 24 h; the captured 3 likewise.
      - { name: time_format,      off: 7, default: 3 }
      - { name: est_point_type,   off: 8, invalid: 0xff }
    every: 600ms       # the captured ack rate
    owns: ack
    timeout: 5s
    status: code
    ref: "stock ClusterService$NaviCluster TBTSubInfo packer; the captured ack frame"

  # OperationStatus, func 0x0D11: whether a navigation owns the cluster's
  # pane (1), with or without a route; 0 releases it. Stock claims with
  # tbt-alive 1 then this 1, and releases with tbt-alive 0 then this 0.
  - name: nav-operation
    dir: to_micom
    hdr: cluster_tx
    cmd: 0x11
    length: 1
    fields:
      - { name: status, off: 0, enum: operation }
    end:
      - { msg: nav-operation, set: { status: released } }
    status: code
    ref: "stock ClusterService$NaviCluster.sendOperationStatus (1 byte), Navigation$Func OPERATION_STATUS 0x11; GPM claimCluster/onStatus; DiPO u.java claim and release"

  # ALIVE, func 0x0D0E: the navigation is alive, 1 byte.
  - name: tbt-alive
    dir: to_micom
    hdr: cluster_tx
    cmd: 0x0e
    length: 1
    fields:
      - { name: alive, off: 0, type: bool }
    end:
      - { msg: tbt-alive, set: { alive: false } }
    status: code
    ref: "stock ClusterService$NaviCluster.sendAlive (mIsAlive 1/0), Navigation$Func ALIVE 0x0e"

  # DAY_NIGHT_STATUS, func 0x0D0F: the navigation's look, 1 byte.
  - name: cluster-day-night
    dir: to_micom
    hdr: cluster_tx
    cmd: 0x0f
    length: 1
    fields:
      - { name: mode, off: 0, enum: day_night }
    status: code
    ref: "stock ClusterService$NaviCluster.sendDayNight (mIsNight 1/0), Navigation$Func DAY_NIGHT_STATUS 0x0f"

  # HU_CurPosition, cluster IL 0x17: the unit's GPS position, latitude then
  # longitude, each 0x7ffffff + 100 x arc-seconds, big endian. Stock sends it
  # every 1 s with IGN on, from the last GPS fix, and nothing while it has
  # none; so here only while a client feeds it (micom-livi -gpsd). Stock
  # splits degrees, minutes and seconds and negates only the degrees, so a
  # southern or western coordinate is off by twice its minutes and seconds:
  # what the cluster expects, the fault or the true value, is not known.
  - name: cluster-position
    dir: to_micom
    hdr: status_tx
    cmd: 0x17
    length: 8
    fields:
      - { name: lat_arcsec, off: 0, type: u32, scale: 0.01, offset: -1342177.27, min: -324000, max: 324000 }
      - { name: lon_arcsec, off: 4, type: u32, scale: 0.01, offset: -1342177.27, min: -648000, max: 648000 }
    every: 1s
    timeout: 5s
    status: code
    ref: "stock ClusterLocationManager.sendLocationInfo / ClusterService.updatePositionInfo (IL HU_CurPosition), every 1 s with IGN on; the captured frames decode to the unit's position then"

  # Battery conditioning: what stock's navigation tells the car when it
  # routes to a fast charger, so the BMS warms the pack. Stock sends the
  # distance and time to the charger, then the station event; it follows
  # each station event with 07 07 (invalid) 120 ms later, a pulse. The BMS
  # decides: READY, conditioning enabled in the car's EV settings, the pack
  # cold. Gen5W community tooling (Launchpad) starts with 9 km, 18 min and
  # station 2/3, refreshes the two every 5 s, and stops with 2047 km,
  # 1023 min and station 0/0.
  - name: batt-cond-route-distance
    dir: to_micom
    hdr: poll_tx
    cmd: 0x66
    length: 2
    fields:
      - { name: km, off: 0, type: u16, max: 2047 }   # 2047: none
    on_change: false
    status: code
    ref: "stock HEVService.setBattCondRouteDis: sendPacket(0x88, 0x0c, 0x0c66, [hi, lo])"
  - name: batt-cond-remain-time
    dir: to_micom
    hdr: poll_tx
    cmd: 0x65
    length: 2
    fields:
      - { name: minutes, off: 0, type: u16, max: 1023 }   # 1023: none
    on_change: false
    status: code
    ref: "stock HEVService.setBattCondRemainTime: sendPacket(0x88, 0x0c, 0x0c65, [hi, lo])"
  - name: batt-cond-ev-station
    dir: to_micom
    hdr: poll_tx
    cmd: 0x68
    length: 2
    fields:
      - { name: flag, off: 0, max: 15 }   # 2 start, 0 stop, 7 invalid
      - { name: type, off: 1, max: 15 }   # 3 start, 0 stop, 7 invalid
    on_change: false
    status: code
    ref: "stock HEVService.setBattCondEvStation: sendPacket(0x88, 0x0c, 0x0c68, [flag & 0xf, type & 0xf]), then HEVService$6 [7, 7] after 120 ms; github.com/paytondevs/gen5w-preconditioning PreconditioningProfile"
  # The EV settings' "Battery Conditioning Mode": on starts conditioning now
  # and lets the navigation's route (above) start it; the car holds it and
  # reports it as "Battery conditioning mode". Stock follows it with
  # default (00) 120 ms later, a pulse: here its timeout and end send that.
  - name: batt-cond-mode
    dir: to_micom
    hdr: poll_tx
    cmd: 0x62
    length: 1
    fields:
      - { name: mode, off: 0, enum: batt_cond_mode, reflects: { msg: "Battery conditioning mode", field: "Battery conditioning mode", unless: [0] } }
    timeout: 120ms
    end:
      - { msg: batt-cond-mode, set: { mode: default } }
    status: code
    ref: "stock HEVManager.setBatteryConditioning -> HEVService: sendPacket(0x88, 0x0c, 0x0c62, [mode]), then HEVService$5 [0] after 120 ms"

  # The EV schedules and charge settings, as stock packs them for CAN DB
  # generation 2 (this car's boot record byte 120) and reads them back
  # (gen > 0). All from HEVService; none seen on the wire but the readbacks
  # at their defaults. reflects: is where the car reports a write back
  # (micom-fake). The writes change what the car does unattended, so they
  # are dangerous: -allow-dangerous on top of -allow-inferred.
  # hkmc-gen5w-ev's "Departure timers" (bytes 3-4) with the rest of 0x8C55
  # (gen > 0): the days and set 1's enable. One message, as a frame decodes
  # as its first match only.
  - name: "Departure timers"
    dir: from_micom
    hdr: "0c 88 ?? 8c"
    cmd: 0x55
    min_length: 8
    fields:
      - { name: "Departure 1 hour",        off: 3, bits: "4:0" }
      - { name: "Departure 1 minute bits", off: 3, bits: "7:5" }
      - { name: "Departure 2 hour",        off: 4, bits: "4:0" }
      - { name: "Departure 2 minute bits", off: 4, bits: "7:5" }
      - { name: "Departure 1 Monday",    off: 5, bits: "1:0" }
      - { name: "Departure 1 Tuesday",   off: 5, bits: "3:2" }
      - { name: "Departure 1 Wednesday", off: 5, bits: "5:4" }
      - { name: "Departure 1 Thursday",  off: 5, bits: "7:6" }
      - { name: "Departure 1 enabled",   off: 6, bits: "1:0" }
      - { name: "Departure 1 Friday",    off: 6, bits: "3:2" }
      - { name: "Departure 1 Saturday",  off: 6, bits: "5:4" }
      - { name: "Departure 1 Sunday",    off: 6, bits: "7:6" }
      - { name: "Departure 2 Monday",    off: 7, bits: "1:0" }
      - { name: "Departure 2 Tuesday",   off: 7, bits: "3:2" }
      - { name: "Departure 2 Wednesday", off: 7, bits: "5:4" }
      - { name: "Departure 2 Thursday",  off: 7, bits: "7:6" }
    status: code
    ref: "HEVService G3CAN_VCU_04_1_M (func 0x8c55, gen > 0); 0 in all 43k frames of a 2026-11 capture (nothing set)"
  - name: "Schedule settings"
    dir: from_micom
    hdr: "0c 88 ?? 8c"
    cmd: 0x53
    min_length: 8
    fields:
      - { name: "Departure 2 enabled",  off: 0, bits: "1:0" }
      - { name: "Departure 2 Friday",   off: 0, bits: "3:2" }
      - { name: "Departure 2 Saturday", off: 0, bits: "5:4" }
      - { name: "Departure 2 Sunday",   off: 0, bits: "7:6" }
      - { name: "Off-peak start hour",        off: 1, bits: "4:0" }
      - { name: "Off-peak start minute bits", off: 1, bits: "7:5" }
      - { name: "Off-peak end hour",          off: 2, bits: "4:0" }
      - { name: "Off-peak end minute bits",   off: 2, bits: "7:5" }
      - { name: "Scheduled charging mode",    off: 5, bits: "1:0", enum: sched_charge_mode }
      - { name: "Scheduled climate",             off: 7, bits: "1:0" }
      - { name: "Scheduled climate temperature", off: 7, bits: "7:2" }   # encoding unknown; 0x14 (20) at the default
    status: code
    ref: "HEVService G3CAN_VCU_04_2_M (func 0x8c53); seen 8 times as 00 14 10 02 00 40 00 50 (20:00-16:00, mode 0, climate off)"
  - name: "Scheduled charge window"
    dir: from_micom
    hdr: "0c 88 ?? 8c"
    cmd: 0x54
    min_length: 8
    fields:
      - { name: "Scheduled climate defrost", off: 0, bits: "1:0" }
      - { name: "Temperature unit",          off: 3, bits: "7:6" }
      # The window the car computed (7 days, 31 hours, 63 minutes: none).
      # Its end day and minute straddle bytes 5-7 and are left out.
      - { name: "Scheduled charge start day",    off: 4, bits: "2:0" }
      - { name: "Scheduled charge start hour",   off: 4, bits: "7:3" }
      - { name: "Scheduled charge start minute", off: 5, bits: "5:0" }
      - { name: "Scheduled charge end hour",     off: 6, bits: "5:1" }
    status: code
    ref: "HEVService G3CAN_VCU_04_3_M (func 0x8c54); seen 13 times as 00 01 00 40 ff ff ff 0f (no window)"

  # setEconomicChargeTime: weekday then weekend window, and the charging
  # mode. Stock shifts the weekend hours by 5, not 3, so only their low 3
  # bits go; the car reads back one window. The EV app's off-peak dialog has
  # one window and two modes. Stock under QEMU (micom-fake, 2026-11-11):
  # b0 30 00 00 c0 for 10:00 PM-6:00 AM charge only, ... 80 for prioritize,
  # ff ff 00 00 00 (nothing set) at start; the weekend bytes stay 0.
  - name: ev-off-peak
    dir: to_micom
    hdr: poll_tx
    cmd: 0x05
    length: 5
    fields:
      - { name: start_hour,     off: 0, bits: "7:3", max: 23, reflects: { msg: "Schedule settings", field: "Off-peak start hour" } }
      - { name: start_min_bits, off: 0, bits: "2:0",          reflects: { msg: "Schedule settings", field: "Off-peak start minute bits" } }
      - { name: end_hour,       off: 1, bits: "7:3", max: 23, reflects: { msg: "Schedule settings", field: "Off-peak end hour" } }
      - { name: end_min_bits,   off: 1, bits: "2:0",          reflects: { msg: "Schedule settings", field: "Off-peak end minute bits" } }
      - { name: weekend_start_hour_low, off: 2, bits: "7:5", default: 0 }
      - { name: weekend_start_min_bits, off: 2, bits: "2:0", default: 0 }
      - { name: weekend_end_hour_low,   off: 3, bits: "7:5", default: 0 }
      - { name: weekend_end_min_bits,   off: 3, bits: "2:0", default: 0 }
      - { name: mode, off: 4, bits: "7:6", enum: sched_charge_mode, reflects: { msg: "Schedule settings", field: "Scheduled charging mode" } }
    on_change: false
    dangerous: "sets the car's off-peak charging window, which it acts on unattended"
    status: code
    ref: "stock HEVService.setEconomicChargeTime, mCanDBGenerationInfo >= 2: sendPacket(0x88, 0x0c, 0x0c05, 5 bytes)"
  # setDepartTimeNClimateSet: stock's 28 slots, MSB first for generation 2;
  # the slot names are the generation 0 readback's (0x8C0F). Stock under
  # QEMU (micom-fake, 2026-11-11), each field as laid out here: 00 a1 ff 00
  # 27 13 80 for departure 1 12:00 AM Mon Wed on; 00 a1 9b 05 27 14 00 with
  # departure 2 7:30 PM Sat on; a9 94 at [4..5] for climate on, 76 °F,
  # defrost (19 at 75 °F: temp = °F - 56 with unit 1, two points only);
  # ff 00 ff 00 .. (hour 31, minute 7) when nothing is set.
  - name: ev-departures
    dir: to_micom
    hdr: poll_tx
    cmd: 0x06
    length: 7
    fields:
      - { name: d1_hour,     off: 0, bits: "7:3", max: 23, reflects: { msg: "Departure timers", field: "Departure 1 hour" } }
      - { name: d1_min_bits, off: 0, bits: "2:0",          reflects: { msg: "Departure timers", field: "Departure 1 minute bits" } }
      - { name: d1_mon, off: 1, bits: "7", reflects: { msg: "Departure timers", field: "Departure 1 Monday" } }
      - { name: d1_tue, off: 1, bits: "6", reflects: { msg: "Departure timers", field: "Departure 1 Tuesday" } }
      - { name: d1_wed, off: 1, bits: "5", reflects: { msg: "Departure timers", field: "Departure 1 Wednesday" } }
      - { name: d1_thu, off: 1, bits: "4", reflects: { msg: "Departure timers", field: "Departure 1 Thursday" } }
      - { name: d1_fri, off: 1, bits: "3", reflects: { msg: "Departure timers", field: "Departure 1 Friday" } }
      - { name: d1_sat, off: 1, bits: "2", reflects: { msg: "Departure timers", field: "Departure 1 Saturday" } }
      - { name: d1_sun, off: 1, bits: "1", reflects: { msg: "Departure timers", field: "Departure 1 Sunday" } }
      - { name: d1_on,  off: 1, bits: "0", reflects: { msg: "Departure timers", field: "Departure 1 enabled" } }
      - { name: d2_hour,     off: 2, bits: "7:3", max: 23, reflects: { msg: "Departure timers", field: "Departure 2 hour" } }
      - { name: d2_min_bits, off: 2, bits: "2:0",          reflects: { msg: "Departure timers", field: "Departure 2 minute bits" } }
      - { name: d2_mon, off: 3, bits: "7", reflects: { msg: "Departure timers", field: "Departure 2 Monday" } }
      - { name: d2_tue, off: 3, bits: "6", reflects: { msg: "Departure timers", field: "Departure 2 Tuesday" } }
      - { name: d2_wed, off: 3, bits: "5", reflects: { msg: "Departure timers", field: "Departure 2 Wednesday" } }
      - { name: d2_thu, off: 3, bits: "4", reflects: { msg: "Departure timers", field: "Departure 2 Thursday" } }
      - { name: d2_fri, off: 3, bits: "3", reflects: { msg: "Schedule settings", field: "Departure 2 Friday" } }
      - { name: d2_sat, off: 3, bits: "2", reflects: { msg: "Schedule settings", field: "Departure 2 Saturday" } }
      - { name: d2_sun, off: 3, bits: "1", reflects: { msg: "Schedule settings", field: "Departure 2 Sunday" } }
      - { name: d2_on,  off: 3, bits: "0", reflects: { msg: "Schedule settings", field: "Departure 2 enabled" } }
      - { name: d1_climate,   off: 4, bits: "7",   reflects: { msg: "Schedule settings", field: "Scheduled climate" } }
      - { name: d1_temp,      off: 4, bits: "6:1", reflects: { msg: "Schedule settings", field: "Scheduled climate temperature" } }
      - { name: d1_temp_unit, off: 4, bits: "0",   reflects: { msg: "Scheduled charge window", field: "Temperature unit" } }
      - { name: d1_defrost,   off: 5, bits: "7",   reflects: { msg: "Scheduled charge window", field: "Scheduled climate defrost" } }
      - { name: d2_climate,   off: 5, bits: "6", default: 0 }
      # Set 2's climate has no readback; stock sends set 1's temperature and
      # unit in it (both captures above), so they are copied, never guessed.
      - { name: d2_temp,      off: 5, bits: "5:0", from: { field: "Scheduled climate temperature" } }
      - { name: d2_temp_unit, off: 6, bits: "7",   from: { field: "Temperature unit" } }
      - { name: d2_defrost,   off: 6, bits: "6", default: 0 }
    on_change: false
    dangerous: "sets the car's departure timers and scheduled climate, which it acts on unattended"
    status: code
    ref: "stock HEVService.setDepartTimeNClimateSet, mCanDBGenerationInfo >= 2: sendPacket(0x88, 0x0c, 0x0c06, 7 bytes); readback G3CAN_VCU_04_1/2/3_M"
  # setTargetSOCext: one limit at a time from the EV app, 0xff the others.
  # With a limit the app sends winter mode 3 (00 00 c0 00 ff 8c ff for DC
  # 70 %: stock under QEMU, micom-fake, 2026-11-11), read here as unchanged.
  - name: ev-charge-limits
    dir: to_micom
    hdr: poll_tx
    cmd: 0x18
    length: 7
    fields:
      - { name: winter_mode, off: 2, bits: "7:6", invalid: 3, reflects: { msg: "Winter mode", field: "Winter mode" } }
      - { name: ac_limit,    off: 4, scale: 0.5, unit: " %", invalid: 0xff, min: 50, max: 100, reflects: { msg: "Charge limit, AC", field: "Charge limit, AC" } }
      - { name: dc_limit,    off: 5, scale: 0.5, unit: " %", invalid: 0xff, min: 50, max: 100, reflects: { msg: "Charge limit, DC", field: "Charge limit, DC" } }
      - { name: route_limit, off: 6, scale: 0.5, unit: " %", invalid: 0xff }
    on_change: false
    dangerous: "sets the car's charge limits; one below the charge stops an AC charge"
    status: code
    ref: "stock HEVService.setTargetSOCext, mCanDBGenerationInfo >= 2: sendPacket(0x88, 0x0c, 0x0c18, 7 bytes); readback items 0x21/0x22/0x44"
  - name: ev-charging-current
    dir: to_micom
    hdr: poll_tx
    cmd: 0x5b
    length: 1
    fields:
      - { name: current, off: 0, enum: ac_current, reflects: { msg: "AC charging current", field: "AC charging current", unless: [0] } }
    timeout: 120ms
    end:
      - { msg: ev-charging-current, set: { current: default } }
    dangerous: "sets the car's AC charging current"
    status: code
    ref: "stock HEVService.setOBCCurrent (flag 82 = 1): sendPacket(0x88, 0x0c, 0x0c5b, getInCurrModeValue(iccb, false)), 0 after 120 ms"
  - name: ev-v2l-limit
    dir: to_micom
    hdr: poll_tx
    cmd: 0x5a
    length: 1
    fields:
      - { name: limit, off: 0, invalid: 0xff, reflects: { msg: "V2L discharge limit", field: "V2L discharge limit" } }
    timeout: 120ms
    end:
      - { msg: ev-v2l-limit, set: { limit: null } }
    dangerous: "sets the car's V2L discharge limit"
    status: code
    ref: "stock HEVService: sendPacket(0x88, 0x0c, 0x0c5a, limSoc), 0xff after 120 ms"

  # Power and ACC, from the micom firmware (CV_E.USA.S5W_M.V002.208) in
  # emulation and disassembly; not yet seen from a car. The ACC-off timeline
  # and a clean shutdown are in docs/messages.md ("Power").
  # 0x8108 on every power state change: [00, state, 00] going down,
  # [01, 05] when ACC comes back.
  - name: "Power state"
    dir: from_micom
    hdr: system_rx
    cmd: 0x08
    length: 3
    when: [ { off: 0, eq: 0x00 } ]
    fields:
      - { name: "Power state", off: 1, enum: power_state }
    status: code
    ref: "micom firmware FUN_0006ee40; firmware emulation, ACC off to state 0"
  - name: "Power state (ACC on)"
    dir: from_micom
    hdr: system_rx
    cmd: 0x08
    length: 2
    when: [ { off: 0, eq: 0x01 } ]
    fields:
      - { name: "Power state", off: 1, enum: power_state }
    status: code
    ref: "firmware emulation: ff 01 8a 01 81 08 00 03 01 05 fb on ACC on"
  # 0x8133: the ACC edge, before the 0x8108 of the same change.
  - name: "ACC edge"
    dir: from_micom
    hdr: system_rx
    cmd: 0x33
    length: 1
    fields:
      - { name: "ACC", off: 0, enum: acc_edge }
    status: code
    ref: "firmware emulation: 0x8133 [01] on ACC off, [02] on ACC on"
  # Stock's ignition, ALT-L and low fuel/charge warning (sticky
  # SYSTEM_STATE_IGN1/ALTL/FUELWANING). IGN1 went 00 at ACC off and 01 at
  # ACC on in the captures; ALT-L is the DC-DC on an EV, so the car READY.
  # (The micom firmware also feeds 0x810a into its CAN rheostat selection.)
  - name: "IGN1"
    dir: from_micom
    hdr: system_rx
    cmd: 0x0a
    length: 1
    fields:
      - { name: "IGN1", off: 0, type: bool }
    status: captured
    ref: "stock SYS_IGN_STATUS_M (0x810a); 00 at ACC off, 01 at ACC on, 2026-11 captures; micom firmware FUN_00062f9c"
  - name: "Vehicle ready"
    dir: from_micom
    hdr: system_rx
    cmd: 0x0b
    length: 1
    fields:
      - { name: "Vehicle ready", off: 0, type: bool }
    status: code
    ref: "stock SYS_ALTERNATE_STATUS_M (0x810b, ALT-L); micom firmware, 0x810b sender (a CAN value, debounced 0.5 s)"
  - name: "Charge warning"
    dir: from_micom
    hdr: system_rx
    cmd: 0x0c
    length: 1
    fields:
      - { name: "Charge warning", off: 0, type: bool }   # always 0 on this micom build (FUN_00073e46)
    status: code
    ref: "stock SYS_FUELWARNING_STATUS_M (0x810c); micom firmware FUN_00073e46"
  # Stock's SYS_ILLUMINATION_STATUS_M: any non-zero is day ("illuminate
  # on"), 0 night. The micom sends NOT(CAN 0x11f == 1), on change only;
  # stock seeds the state from the 0x8101 boot record (below). Stock's dim
  # mode overrides it: day and night force it, auto and manual follow it.
  - name: "Illumination"
    dir: from_micom
    hdr: system_rx
    cmd: 0x0d
    length: 1
    fields:
      - { name: "Illumination", off: 0, enum: illumination }
    status: code
    ref: "stock SystemService/VideoSetupService SYS_ILLUMINATION_STATUS_M; micom firmware 0x810d sender; firmware emulation"
  # The whole boot record, read first: the car's state when the micom
  # answered, which the frames below send only on change. Byte 2 the
  # driving regulation, 7 bits ACC 7, IGN1 6, ALT-L (ready) 5, IGN3 1; 8 bits
  # reverse 6, parking brake 1; 120 the CAN DB generation; 130 the two-way
  # light sensor fitted; 148 regulation B.
  - name: "Boot record (full)"
    dir: from_micom
    hdr: system_rx
    cmd: 0x01
    min_length: 149
    fields:
      - { name: "Boot mode", off: 0 }
      - { name: "Reset reason", off: 1 }
      - { name: "Driving regulation", off: 2, type: bool }
      - { name: "Illumination", off: 4, enum: illumination }
      - { name: "ACC", off: 7, bits: "7", type: bool }
      - { name: "IGN1", off: 7, bits: "6", type: bool }
      - { name: "Vehicle ready", off: 7, bits: "5", type: bool }
      - { name: "IGN3", off: 7, bits: "1", type: bool }
      - { name: "Reverse", off: 8, bits: "6", type: bool }
      - { name: "Parking brake", off: 8, bits: "1", type: bool }
      - { name: "Dim mode", off: 0x12, enum: dim_mode }
      - { name: "CAN DB generation", off: 120 }
      - { name: "Light sensor fitted", off: 130, type: bool }
      - { name: "Driving regulation B", off: 148, type: bool }
    status: code
    ref: "stock SystemService InitialCarInfo; 149 bytes, byte 120 = 02 and byte 7 = ca in 2026-11 captures"
  # Stock's regulation-B inputs (0x8189, answering 0x0189 or on change):
  # in P, parking brake, electric parking brake, and the gearbox type. Seen
  # 00 00 {02, 04, 01} ff while leaving Park: the EPB values are not known.
  - name: "Regulation inputs"
    dir: from_micom
    hdr: system_rx
    cmd: 0x89
    min_length: 3
    fields:
      - { name: "In P", off: 0, type: bool }
      - { name: "Parking brake lever", off: 1, type: bool }
      - { name: "EPB state", off: 2 }
    status: captured
    ref: "stock SYS_SPEED_REG_TYPE_B_M_RESP (0x8189) -> onGearPStatus / onParkingBrakeStatus / onEPBStatus; 3 frames, 2026-11"
  # Stock's InitialCarInfo: the micom's answer to boot-mode-request (it
  # never sends it unasked), 149 bytes on this car. Byte 0 is the boot mode
  # (what woke the car: 1 normal, 2 door unlock, 8 charging, ...), 1 the
  # micom's reset reason, 4 the illumination from the same CAN bit as
  # 0x810d, 0x12 the dim mode. Seen live: night gave 00 at byte 4.
  - name: "Boot record"
    dir: from_micom
    hdr: system_rx
    cmd: 0x01
    min_length: 0x13
    fields:
      - { name: "Boot mode", off: 0 }
      - { name: "Reset reason", off: 1 }
      - { name: "Illumination", off: 4, enum: illumination }
      - { name: "Dim mode", off: 0x12, enum: dim_mode }
    status: captured
    ref: "stock SystemService requestBootMode / InitialCarInfo; micom firmware 0x0101 handler (0x7767a: byte 4 at 0x77884, dim mode config 0xb7 at 0x77986); captured 2026-11-08 in reply to boot-mode-request"
  # Stock's SYS_RHEOSTAT_M. Bits 1 and 2 also toggled with the washer:
  # not explained.
  - name: "Rheostat level"
    dir: from_micom
    hdr: system_rx
    cmd: 0x45
    min_length: 1
    fields:
      - { name: "Rheostat level", off: 0 }
    status: code
    ref: "stock SYS_RHEOSTAT_M (func 0x8145)"
  # The 12 V battery, stock's battSoc; also on the body node below.
  - name: "System 0x819B"
    dir: from_micom
    hdr: system_rx
    cmd: 0x9b
    min_length: 8
    fields:
      - { name: "12 V battery charge", off: 7, unit: " %" }
    status: code
    ref: "stock battSoc, func 0x819b byte 7"

  # SoC→micom system service commands confirmed from the micom firmware command
  # dispatcher (0x774a2; jump table at 0x77526) and emulation (watching the
  # firmware console). Each is dangerous: it arms an update/download boot or
  # changes power/sleep state, so it is refused unless -allow-dangerous.
  - name: sys-update-reservation
    dir: to_micom
    hdr: system_tx
    cmd: 0x57
    length: 1
    fields:
      - { name: value, off: 0 }
    on_change: false
    status: inferred
    dangerous: "func 0x0157 SYS_UPDATE_RESERVATION_C: arms a software-update boot on the next cycle"
    ref: "micom dispatcher cmd 0x57 -> event 0x125; emulated firmware console 2026-11-10 ('SYS_UPDATE_RESERVATION_C : 0x1, 0x20')"
  - name: sys-download-reservation
    dir: to_micom
    hdr: system_tx
    cmd: 0x8d
    length: 1
    fields:
      - { name: value, off: 0 }
    on_change: false
    status: inferred
    dangerous: "func 0x018d SYS_DOWNLOAD_RESERVATION_C: arms a download boot on the next cycle"
    ref: "micom dispatcher cmd 0x8d -> event 0x18a; emulated firmware console 2026-11-10 ('SYS_DOWNLOAD_RESERVATION_C : 0x1, 0xFA')"
  - name: sys-sleep-boot-control
    dir: to_micom
    hdr: system_tx
    cmd: 0x67
    length: 2
    fields:
      - { name: mode, off: 0 }   # 0/1/2 -> events 0xc5 / 0x146 / 0x147
      - { name: flag, off: 1 }
    on_change: false
    status: inferred
    dangerous: "func 0x0167: sleep / next-boot control (Set Sleep Mode, NEXT BOOT force-update / DSP tuning)"
    ref: "micom dispatcher cmd 0x67; name tentative (strings in the event consumers)"
  - name: "12 V battery"
    dir: from_micom
    hdr: body
    cmd: 0x14
    min_length: 1
    fields:
      - { name: "12 V battery charge (body)", off: 0, unit: " %" }
    status: code
    ref: "stock BODY Batt_SoC"
  # Replies of the display node to SoC queries.
  - name: "Display 0x880C"
    dir: from_micom
    hdr: display_rx
    cmd: 0x0c
    min_length: 1
    fields:
      - { name: "Display 0x880C", off: 0 }   # RAM 0x400118e8, meaning unknown; 02 in emulation
    status: code
    ref: "firmware emulation: 0x080C [00] answered ff 08 8c 01 88 0c 00 02 02 fe"
  - name: "Rheostat"
    dir: from_micom
    hdr: display_rx
    cmd: 0x10
    min_length: 1
    fields:
      - { name: "Rheostat step", off: 0 }   # 0-21; 20 in emulation
    status: code
    ref: "firmware emulation: 0x0810 [00] answered 14"
  - name: "Display 0x8813"
    dir: from_micom
    hdr: display_rx
    cmd: 0x13
    min_length: 1
    fields:
      - { name: "Display 0x8813", off: 0 }   # RAM 0x400172a0; 0x32 in emulation
    status: code
    ref: "firmware emulation: 0x0813 [00] answered 32"
  # The answer to stock's current-brightness request (0x081B): the
  # brightness, u16, then, by stock, the light sensor's u16, not decoded
  # here as it may be absent. Sent only with the "new display option"
  # (0x40011990 & 0x60000).
  - name: "Current brightness"
    dir: from_micom
    hdr: display_rx
    cmd: 0x1b
    min_length: 2
    fields:
      - { name: "Current brightness", off: 0, type: u16 }
    status: code
    ref: "stock current brightness request 0x081B and its reply; micom firmware 0x081B handler"

  # Driving state the micom relays, found by lining snapshots up with an
  # OBD2 logger on a drive (r >= 0.99) and by labelled toggles.
  # Byte 1 is the speed in 0.5 mph (raw 134 = 67 mph; motor rpm was
  # 61.5 x raw + 114). Byte 0 is unknown.
  - name: "Vehicle speed"
    dir: from_micom
    hdr: body
    cmd: 0x20
    min_length: 2
    fields:
      - { name: "Vehicle speed",       off: 1, scale: 0.804672, unit: " km/h" }   # 0.5 mph
      - { name: "Vehicle speed (mph)", off: 1, scale: 0.5,      unit: " mph" }
    status: captured
    ref: "drive 2026-11, micomd snapshots against Car Scanner OBD2 speed (r >= 0.99)"
  # The state of charge as the car displays it, and the remaining energy.
  # 54-59 kWh seen.
  - name: "Battery"
    dir: from_micom
    hdr: cluster_rx
    cmd: 0x47
    min_length: 7   # always 11 in the captures
    fields:
      - { name: "State of charge",          off: 0, scale: 0.5,   unit: " %" }
      # Signed is a guess: only 20-24 °C seen.
      - { name: "Battery minimum temperature", off: 1, type: i8, unit: " °C" }
      - { name: "Battery remaining energy", off: 2, type: u16, scale: 0.002, unit: " kWh" }
      # Likely, not certain: r 0.97/0.88 driving, 0.84/0.67 charging.
      # TODO: stock names byte 6 DATC_OutTempSnsr, the climate's outside air
      # sensor, which the fit (0.53 * raw - 44) is also near. Check against
      # the outdoor temperature (climate_panel 0x02) on a day the pack and
      # the air differ.
      - { name: "Battery inlet temperature", off: 6, scale: 0.5, offset: -40, unit: " °C" }
    status: captured
    ref: "drive 2026-11, micomd snapshots against Car Scanner OBD2 displayed SoC, minimum battery temperature (r 0.998), remaining energy (r >= 0.99) and battery inlet temperature (fit 0.53*raw-44)"
  # Battery conditioning running: 1 from 68 s after micom-precondition's
  # start until its stop, with the EV power block's battery heater byte
  # 0 -> 53-54 -> 0 and 0c88018c 54 byte 1 over the same window (01, 05 at
  # the start, 15 once heating, 01 at the stop).
  - name: "Battery conditioning"
    dir: from_micom
    hdr: body
    cmd: 0x53
    length: 1
    fields:
      - { name: "Battery conditioning", off: 0, type: bool }
    status: captured
    ref: "micom-precondition test 2026-11-09 00:16-00:18, parked READY, pack 18 °C"
  # Active while cruise control holds the speed: it followed off, resume,
  # off and set exactly; arming cruise does not change it. The set speed,
  # LKAS and the following distance are not on this link.
  # TODO: stock reads byte 0 as VCRM_HDA, Highway Driving Assist's state
  # (bytes 1-4: info display, lane-centring, alive, navigation status), so
  # this may be HDA, which follows cruise on a highway. Needs a capture with
  # cruise set off the highway.
  - name: "Cruise control"
    dir: from_micom
    hdr: cluster_rx
    cmd: 0x46
    min_length: 1
    fields:
      - { name: "Cruise control", off: 0, enum: cruise }
    status: captured
    ref: "drive 2026-11, labelled cruise off/resume/off/set toggles"
  # The rest checked against the car's own cluster, while charging.
  # Distance to empty, in both units; byte 0 unknown (02 seen).
  - name: "Range"
    dir: from_micom
    hdr: cluster_rx
    cmd: 0x43
    min_length: 5
    fields:
      - { name: "Range",        off: 3, type: u16, unit: " km" }
      - { name: "Range (mi)",   off: 1, type: u16, unit: " mi" }
    status: captured
    ref: "02 00 75 00 bc against the cluster's 117 mi"
  # The sign the cluster shows, 5 Hz; 0 when none. Byte 4 repeats at 5 and is
  # 2 * mph - 10 (an unknown unit). Byte 15 (0x10 mostly while a sign shows)
  # and bytes 18-19 (brief 83 01, a3 03, 63 03) are unknown; bytes 0-2 are a
  # rolling code and a counter.
  - name: "Speed limit"
    dir: from_micom
    hdr: cluster_rx
    cmd: 0x2d
    min_length: 15
    fields:
      - { name: "Speed limit", off: 14, unit: " mph" }
    status: captured
    ref: "drive 2026-11, 41k frames: 50-75 mph in 5s, every one 2 * mph - 10 at byte 4"
  - name: "Odometer"
    dir: from_micom
    hdr: body
    cmd: 0x22
    min_length: 3
    fields:
      - { name: "Odometer", start_bit: 7, bit_length: 24, scale: 0.1, unit: " km" }
    status: captured
    ref: "06 c4 0c (44340.4 km) against the cluster's 27551 mi"
  # °F + 40 in one byte.
  - name: "Outdoor temperature"
    dir: from_micom
    hdr: climate_panel
    cmd: 0x02
    min_length: 1
    fields:
      - { name: "Outdoor temperature",      off: 0, scale: 0.5555555555555556, offset: -40, unit: " C" }
      - { name: "Outdoor temperature (F)",  off: 0, offset: -40, unit: " F" }
    status: captured
    ref: "5e against the cluster's 54 F"
  # A second speed, in whole km/h; it follows the one Car Scanner reads
  # from the climate module over OBD2 ("[HVAC] Real Vehicle Speed", r
  # 0.98), whatever its source here. Neither is the true speed: against
  # the phone's GNSS ground speed this one reads 1.4 % low and 44c100c4 20
  # 1.1 % high, so 44c100c4 20 stays the speed to use. Byte 0 was always 0.
  - name: "Vehicle speed (whole km/h)"
    dir: from_micom
    hdr: system_rx
    cmd: 0x31
    length: 2
    fields:
      - { name: "Vehicle speed (whole km/h)", off: 0, type: u16, unit: " km/h" }
    status: captured
    ref: "drive 2026-11-08 18:21-18:36 against Car Scanner OBD2 [HVAC] Real Vehicle Speed, and against ground speed from the phone's positions (579 10 s windows above 40 km/h) and the unit's gpsd"
  # An OBD-II mode 01 reply for PID 0x5b (hybrid/EV pack remaining life,
  # A * 100 / 255 %), relayed while a tester asked for it: it tracked the
  # BMS's own state of charge. Other replies on this header: 41 31 (distance
  # since codes cleared), 62 01 .. (UDS ReadDataByIdentifier), 7f (negative).
  - name: "OBD pack remaining (PID 0x5b)"
    dir: from_micom
    hdr: diag_relay
    cmd: 0xad
    length: 3
    when: [ { off: 0, eq: 0x41 }, { off: 1, eq: 0x5b } ]
    fields:
      - { name: "OBD pack remaining", off: 2, scale: 0.39215686274509803, unit: " %" }
    status: captured
    ref: "drive 2026-11-08 against Car Scanner OBD2 [BMS] State of Charge BMS (r 0.997, change 0.83): fit 0.383*raw+2.1; payloads 41 5b xx"

  # The EV6 is CAN DB generation 2 (boot record byte 120): the charger's
  # ready bits are 1:0. Every captured frame has byte 3 = 01, ready.
  - name: "Charger state"
    dir: from_micom
    hdr: "0c 88 ?? 8c"
    cmd: 0x4f
    min_length: 4
    fields:
      - { name: "Charger ready", off: 3, bits: "1:0" }
    status: captured
    ref: "HEVService OBC ready (CAN DB generation >= 2); boot record byte 120 = 02 and 0x8c4f byte 3 = 01 in every 2026-11 capture"

  # Replies to the start-up reads. Each snapshot byte is the value its
  # single-signal frame carries (micom-livi splits them back into those).
  # All_Datc_Resp: 59-90 bytes, byte i the TE_RX_IL signal stock maps there.
  - name: "Climate snapshot"
    dir: from_micom
    hdr: climate_panel
    cmd: 0x00
    min_length: 59
    fields:
      - { name: "Snapshot climate on (OpSts)", off: 15 }
      - { name: "Snapshot driver set point (C raw)", off: 2 }
      - { name: "Snapshot fan (raw)", off: 18 }
    status: code
    ref: "stock DATCService All_Datc_Resp; never captured (nothing sent All_Datc_Req)"
  # 0x8bc7: [0] echo, [1] 1 when B-CAN is valid, [2] 1 MM-CAN, 0 B-CAN.
  - name: "B-CAN validity"
    dir: from_micom
    hdr: tele_rx
    cmd: 0xc7
    min_length: 3
    fields:
      - { name: "B-CAN valid", off: 1, type: bool }
      - { name: "MM-CAN",      off: 2, type: bool }
    status: code
    ref: "stock BCMService BCAN_VALID (0x8bc7)"
  # ALL_BCM_Resp: up to 100 bytes; bytes 0-8 the doors (lock, open, as
  # body 0x00-0x08), 12 steering wheel heat, 13 rear defrost, 15 P
  # position, 16 hood, 19 the 12 V charge, 34-36 the odometer.
  - name: "Body snapshot"
    dir: from_micom
    hdr: body
    cmd: 0x0c
    min_length: 37
    fields:
      - { name: "Snapshot driver door open", off: 3 }
      - { name: "Snapshot driver door lock", off: 2 }
      - { name: "Snapshot 12 V charge", off: 19, unit: " %" }
    status: code
    ref: "stock BCMService ALL_BCM_Resp (0xc40c); never captured"
  # Unit_SET as a whole (byte 0 fa): the distance/speed, temperature,
  # efficiency (km, mile), tire pressure, torque and turbo units. A delta
  # (byte 0 the field's index) carries that field alone, the rest stale.
  # The codes are not known.
  - name: "Units (USM)"
    dir: from_micom
    hdr: usm_rx
    cmd: 0x11
    min_length: 8
    when: [ { off: 0, eq: 0xfa } ]
    fields:
      - { name: "Distance unit code",      off: 1 }
      - { name: "Temperature unit code",   off: 2 }
      - { name: "Efficiency unit code (km)", off: 3 }
      - { name: "Efficiency unit code (mi)", off: 4 }
      - { name: "Tire pressure unit code", off: 5 }
    status: code
    ref: "stock USMService Unit_SET (0x9111)"

  # The backlight. Off from power-up until the first on; on is refused while
  # the supply is low. The micom writes a config byte to EEPROM on every
  # frame (0x230), so it is spaced like a persistent one, but it is not
  # persistent: the SoC must send it after each micom start.
  - name: backlight
    dir: to_micom
    hdr: display_tx
    cmd: 0x02
    length: 1
    fields:
      - { name: "on", off: 0, bits: "0", type: bool }
    on_change: false     # every input sends: the micom forgets it on reset
    min_interval: 1s
    status: code
    ref: "firmware emulation: ff 8c 08 01 08 02 00 02 01 73 on, ... 00 72 off; eMIOS0 ch 6 PWM"
  # The shutdown acks, 0x0109. Latched by the micom and not cleared on ACC
  # on, so a stale ack cuts the next ACC-off cycle short: each is sent only
  # while the last power state received is the one it answers.
  - name: shutdown-ack
    dir: to_micom
    hdr: system_tx
    cmd: 0x09
    length: 1
    fields:
      - { name: stage, off: 0, enum: shutdown_ack }
    on_change: false     # an ack repeated is still an ack
    requires:
      - { if: { stage: power_off_request }, field: "Power state", in: [ power_off_request ] }
      - { if: { stage: rail_off },          field: "Power state", in: [ rail_off ] }
    status: code
    ref: "firmware emulation: 0x0109 [01] ff 8a 01 01 01 09 00 02 01 7e, [02] ... 02 7d; status bits b8, b12"

  # Persistent: the micom writes each to EEPROM (block A 0x100 and backup B
  # 0x300) on every frame. Needs -allow-persistent.
  - name: backlight-dim-mode
    dir: to_micom
    hdr: display_tx
    cmd: 0x01
    length: 1
    fields:
      - { name: mode, off: 0, enum: dim_mode }
    persistent: true     # EEPROM 0x1b7, 0x230, 0x286
    min_interval: 1s
    status: code
    ref: "stock MON_SET_DIMMING_MODE_C (0 auto, 1 daylight, 2 night, 3 manual); micom firmware 0x0801 handler; EEPROM trace under emulation"
  # Stock's dimming brightness: the level of one period; auto applies at
  # once, day and night at the next dim mode.
  - name: backlight-period-level
    dir: to_micom
    hdr: display_tx
    cmd: 0x07
    length: 2
    fields:
      - { name: period, off: 0, enum: period }
      - { name: level,  off: 1, max: 10 }   # the micom does not check: 11 reads the next table row
    persistent: true     # EEPROM 0x1b8 day, 0x1b9 night
    min_interval: 1s
    status: code
    ref: "stock dimming brightness [period, level]; micom firmware 0x0807 handler; EEPROM trace under emulation"
  # Stock's user brightness: the manual level, per mille, applied at once in dim mode manual. Stock
  # sends it from a slider: min_interval keeps that from wearing the EEPROM.
  - name: backlight-manual-level
    dir: to_micom
    hdr: display_tx
    cmd: 0x1a
    length: 2
    fields:
      - { name: level, off: 0, type: u16, min: 10, max: 1000 }
    persistent: true     # EEPROM 0x286
    min_interval: 1s
    status: code
    ref: "stock user brightness; micom firmware 0x081A handler; EEPROM trace under emulation"

# The power and backlight tables of the micom firmware.
enums:
  # The off-peak mode: 0 with nothing scheduled (stock's start-up write), 2
  # prioritize off-peak, 3 charge only off-peak (stock under QEMU); 1 unseen.
  sched_charge_mode: { "off": 0, prioritize_off_peak: 2, off_peak_only: 3 }
  power_state: { rail_off: 0, power_off_request: 1, bus_sleep: 3, acc_off_hold: 4, acc_on: 5, stop: 6, standby: 7 }
  acc_edge: { "off": 1, "on": 2 }
  shutdown_ack: { power_off_request: 1, rail_off: 2 }
  dim_mode: { auto: 0, day: 1, night: 2, manual: 3 }
  period: { day: 1, night: 2 }
  cruise: { inactive: 0, active: 2 }
  illumination: { night: 0, day: 1 }   # stock: any non-zero is day
  operation: { released: 0, operating: 1 }   # 2 and 3 exist; their meaning is unknown
  day_night: { day: 0, night: 1 }
