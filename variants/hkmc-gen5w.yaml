# Family base: Hyundai/Kia/Genesis head units on the Mobis DAudio Plus Gen5 Wide
# (Telechips TCC803x) software stack. Only what the shared stock code says;
# what one car showed goes in that car's file.
#
# Not here, because it is micomd's own code: framing and checksum, the
# CPU-alive exchange (01 8a 01 81 / 8a 01 01 01, cmd 0f), the send denylist.
schema: 1
name: hkmc-gen5w
title: "HKMC Gen5 Wide family base: keepalive and shared layouts only"
abstract: true

headers:
  # sendPacket(0x8a, module 1, func 0x01xx), the framing of the captured
  # 0x010F alive reply.
  system_tx: { hdr: "8a 01 01 01", dir: to_micom, status: captured, ref: "the CPU-alive reply" }
  system_rx: { hdr: "01 8a 01 81", dir: from_micom, status: captured, ref: "the CPU-alive request" }
  # MicomAudioService.sendCommand: sndId 0x85, rcvId 2, type 1.
  audio_tx: { hdr: "85 02 01 02", dir: to_micom, status: captured, ref: "stock micomd strace, source switch" }

identify:
  # Asks the micom for its variant coding. Sent only with -identify-request,
  # and, while it is inferred, -allow-inferred.
  request:
    name: variant-code-request
    frame: "ff 8a 01 01 01 17 00 01 62"
    status: inferred
    ref: "jadx SystemService.requestVariantCode(): sendPacket(-118, 1, 279) = func 0x0117; retried 5 times (EVENT_VARIANTCODING_RETRY)"
  # The answer, func 0x8117; decoded below.
  reply:
    name: "Variant code"
    hdr: system_rx
    cmd: 0x17
    status: code
    ref: "micom firmware CV_E.USA.S5W_M.V002.208.220711, 0x0117 handler (0x7882a); answered in emulation"

messages:
  # The micom's variant record (RAM 0x40011964, EEPROM 0x0000), 13 bytes.
  # Vehicle and country are constants of the micom build (EV6 0xcc, Ioniq 5
  # 0xbd, Sonata 0x6e; country 01 in US and global builds, 00 in Korean). The
  # rest is the car's coding from the EEPROM. Values seen so far are only the
  # defaults an empty EEPROM gives, in emulation.
  - name: "Variant code"
    dir: from_micom
    hdr: system_rx
    cmd: 0x17
    min_length: 13
    fields:
      - { name: "Vehicle",      off: 0 }
      - { name: "Country",      off: 1 }
      # A 32-bit word, big-endian. Bit 0 RDS/AF, bit 30 has-modem, bits
      # 27..25 a 3-bit setting (bit 25 set in US builds, clear in Korean).
      - { name: "Options high", off: 2, type: u16 }
      - { name: "Options low",  off: 4, type: u16 }
      - { name: "Byte 6",       off: 6 }
      # "en" in US and global builds, "ko" in Korean ones.
      - { name: "Language",     off: 7, type: str, size: 2 }
      - { name: "Test mode",    off: 9 }
      - { name: "Setting 10",   off: 10 }
      - { name: "Setting 11",   off: 11 }
      - { name: "Test mode 2",  off: 12 }
    status: code
    ref: "micom firmware 0x0117 handler; 61 S5W_M micom builds in emulation (en/ko, country 01/00)"
