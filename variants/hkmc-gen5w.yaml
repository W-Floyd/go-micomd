messages:
  # The micom's variant record (RAM 0x40011964, EEPROM 0x0000), 13 bytes.
  # Vehicle and country are constants of the micom build (EV6 0xcc, Ioniq 5
  # 0xbd, Sonata 0x6e; country 01 in US and global builds, 00 in Korean). The
  # rest is the car's coding from the EEPROM. Values seen so far are only the
  # defaults an empty EEPROM gives, in emulation.
  #
  # Fields as stock Android splits them (SystemService.onVariantCode; the
  # 0x0118 save packs with the same masks). Bytes 2-5 are one big-endian
  # word W, W31 = byte 2 bit 7.
  #
  # Android derives its amp type (VariantCoding index 4) from two bits:
  # 0 internal if W29, else 2 Lexicon if W21, else 1 Actune. Kept as the two
  # bits: a field cannot combine bits. Whether persist.sys.amptype (expect:
  # amp_type) holds that code is unconfirmed: its writer was not found.
  # The climate variant (expect: climate_variant) is not in this reply:
  # stock sets persist.sys.climate.variant from DATCService's
  # DatcBypassStatus, a climate frame, so 0x8117 cannot check it.
  - name: "Variant code"
    dir: from_micom
    hdr: system_rx
    cmd: 0x17
    min_length: 13
    fields:
      - { name: "Vehicle", off: 0, enum: vehicle }
      - { name: "Country", off: 1, enum: country }
      - { name: "Navigation", off: 2, bits: "7" } # W31; follows pin 118 in emulation (active low)
      - { name: "Modem", off: 2, bits: "6" }
      - { name: "Internal amp", off: 2, bits: "5" } # 0: external; follows pin 67 in emulation (active low)
      - { name: "Rear monitor", off: 2, bits: "4" }
      - { name: "Radio region", off: 2, bits: "3:1", enum: radio_region }
      - { name: "DMB", off: 2, bits: "0" }
      - { name: "RHD", off: 3, bits: "7" }
      - { name: "Limo", off: 3, bits: "6" }
      - { name: "External amp", off: 3, bits: "5", enum: external_amp }
      - { name: "Camera", off: 3, bits: "4:3", enum: camera }
      - { name: "Advanced cluster", off: 3, bits: "2" }
      - { name: "HUD", off: 3, bits: "1" }
      - { name: "Rear USB", off: 3, bits: "0" }
      - { name: "RRC", off: 4, bits: "7" }
      - { name: "CDC", off: 4, bits: "6" }
      - { name: "ISDB", off: 4, bits: "5" } # "rearMIC" in logs and micomd
      - { name: "HD Radio", off: 4, bits: "4" }
      - { name: "CMMB", off: 4, bits: "3" }
      - { name: "Internal CDP", off: 4, bits: "2" }
      - { name: "External CDP", off: 4, bits: "1" }
      - { name: "Telematics", off: 4, bits: "0" }
      - { name: "Diranarom", off: 5, bits: "7" }
      - { name: "DAB", off: 5, bits: "6" }
      - { name: "HU type", off: 5, bits: "5", enum: hu_type }
      - { name: "Camera mode", off: 5, bits: "4", enum: camera_mode }
      - { name: "GPS", off: 5, bits: "3" }
      - { name: "Ext CDP feature", off: 5, bits: "2" }
      - { name: "Sub board", off: 5, bits: "1" }
      - { name: "RDS", off: 5, bits: "0" } # W0
      - { name: "DVD region", off: 6, enum: dvd_region }
      # "en" in US and global builds, "ko" in Korean ones.
      - { name: "Language", off: 7, type: str, size: 2 }
      # Opaque to Android: echoed in the 0x0118 save; Engineering Mode writes
      # them with 0x0194.
      - { name: "CPU variant 9", off: 9 }
      - { name: "CPU variant 10", off: 10 }
      - { name: "CPU variant 11", off: 11 }
      # Android reads 0 off, 1 on; the firmware sets bit 7, which reads as 128.
      - { name: "ADM", off: 12, enum: adm }
    status: code
    ref: "micom firmware 0x0117 handler; 61 S5W_M micom builds in emulation (en/ko, country 01/00); EV6 V015.012 automotive-service SystemService.onVariantCode/sendVariantCodeSave, automotive VariantCoding tables"

  # The module-version table Engineering Mode lists (VersionModule.g, EV6
  # V015.011): the software version of each other module on the car's buses,
  # not the micom's own (the "main micom", CAN DB and monitor micom lines of
  # its Micom version screen are not in this reply). 33 reads in order, 96
  # bytes; stock gates on 42 bytes, but a shorter frame throws in the parser.
  #
  # Field labels are the module names the screen shows (ver_module_*); the
  # rest from the decompiled formatters. A module whose first byte is 0x00,
  # 0x7f or 0xff reads as not present. "str" ones are ASCII ("%c.%c%c");
  # the others are one byte each, printed as the format in the comment.
  # Split fields: DATC is "%c.%c%c.%c%c" over a (3) then b (2); VESS (2 + 6)
  # and ADP (5 + 3) are joined the same way; HCU and VCU are one byte each,
  # "%d.%02d". Which bytes mean what is read from the formatters, not seen.
  - name: "Module versions"
    dir: from_micom
    hdr: system_rx
    cmd: 0x74
    min_length: 96
    fields:
      - { name: "HUD", off: 0, type: str, size: 7 }
      - { name: "Cluster", off: 7, type: str, size: 7 }
      - { name: "PSM", off: 14, type: str, size: 3 }
      - { name: "APSM", off: 17, type: str, size: 3 }
      - { name: "IBU", off: 20, type: str, size: 3 }
      - { name: "WPC", off: 23, type: str, size: 3 }
      - { name: "RWPC", off: 26, type: str, size: 3 }
      - { name: "IAU", off: 29, type: str, size: 3 }
      - { name: "DVRS", off: 32, type: str, size: 3 }
      - { name: "DATC a", off: 35, type: str, size: 3 }
      - { name: "RVM 0", off: 38 } # %03d.%03d, or %02x.%02x
      - { name: "RVM 1", off: 39 }
      - { name: "AVM 0", off: 40 } # %d.%02d.%02d, or %02x.%02x
      - { name: "AVM 1", off: 41 }
      - { name: "SCM", off: 42, type: str, size: 3 }
      - { name: "VESS a 0", off: 45 }
      - { name: "VESS a 1", off: 46 }
      - { name: "ADP a 0", off: 47 }
      - { name: "ADP a 1", off: 48 }
      - { name: "ADP a 2", off: 49 }
      - { name: "ADP a 3", off: 50 }
      - { name: "ADP a 4", off: 51 }
      - { name: "MKBD 0", off: 52 } # %02d.%02d, GUI.%02d
      - { name: "MKBD 1", off: 53 }
      - { name: "MKBD 2", off: 54 }
      - { name: "AMP Binary 0", off: 55 } # %02x.%02x.%02x
      - { name: "AMP Binary 1", off: 56 }
      - { name: "AMP Binary 2", off: 57 }
      - { name: "VESS Binary 0", off: 58 } # %02x.%02x
      - { name: "VESS Binary 1", off: 59 }
      - { name: "ADP Binary 0", off: 60 } # %02x.%02x.%02x
      - { name: "ADP Binary 1", off: 61 }
      - { name: "ADP Binary 2", off: 62 }
      - { name: "FR_CMR 0", off: 63 } # %x.%02x
      - { name: "FR_CMR 1", off: 64 }
      - { name: "ADAS_DRV 0", off: 65 } # %x.%02x
      - { name: "ADAS_DRV 1", off: 66 }
      - { name: "HCU", off: 67 }
      - { name: "ECS 0", off: 68 } # %d.%02d
      - { name: "ECS 1", off: 69 }
      - { name: "TCU", off: 70, type: str, size: 3 }
      - { name: "SML 0", off: 73 } # %d.%02d
      - { name: "SML 1", off: 74 }
      - { name: "Unused", off: 75 } # read, never shown
      - { name: "VCU", off: 76 }
      - { name: "AMP 0", off: 77 } # %02d%02d%02d, with a prefix and a mode byte
      - { name: "AMP 1", off: 78 }
      - { name: "AMP 2", off: 79 }
      - { name: "ADP b 0", off: 80 }
      - { name: "ADP b 1", off: 81 }
      - { name: "ADP b 2", off: 82 }
      - { name: "RRC 0", off: 83 } # %02x.%02x
      - { name: "RRC 1", off: 84 }
      - { name: "RDC", off: 85, type: str, size: 3 }
      - { name: "DATC b", off: 88, type: str, size: 2 }
      - { name: "VESS b 0", off: 90 }
      - { name: "VESS b 1", off: 91 }
      - { name: "VESS b 2", off: 92 }
      - { name: "VESS b 3", off: 93 }
      - { name: "VESS b 4", off: 94 }
      - { name: "VESS b 5", off: 95 }
    status: code
    ref: 'EV6 V015.011 HKMC_EngineerMode VersionModule: registerCallback("MicomDataSVM", 0x8a), onEvent accepts func 0x8174 with 42+ bytes (parser needs 96), parsed by g([B); labels from res string ver_module_*; never captured'

  # The versions Engineering Mode's "Micom version" screen shows
  # (EngineeringModeVersion.checkVersion, EV6 V015.011), answer to func 0x0116.
  # The head (86 bytes) reads the same widths in all 10 distinct automotive
  # builds of the 250 Gen5W packages scanned; the two oldest (V013.001 and
  # the Kona Electric V015.011-V016.010 group) stop the tail after MKBD.
  # The head is 86 bytes; stock reads the rest only if the frame is long
  # enough, in this order: Arkamys 4 (86), a flag byte (90), Arkamys DSP and
  # HiFi2 4 + 4 (91, 95), serial date 6 and serial number 32 (99, 105), MKBD 3
  # (137), 6 unread bytes (140), a flag byte and 40 bytes of radio DSP (146,
  # 147). Not fields: a field must lie within the length the message promises.
  #
  # The firmware answers this in emulation with the layout below (22 EV-family
  # builds: vehicle, region, number 301 or 302, build date such as "Feb 21 2025").
  #
  # The screen's lines: main_micom_version is the micom block below
  # ("<vehicle>.<region>.<number>.<date>.MICOM.D"), can_db_version joins the
  # MM and body CAN DB, monitor_micom_version is the monitor. The vehicle
  # byte is the same code as in the variant code.
  - name: "Version info"
    dir: from_micom
    hdr: system_rx
    cmd: 0x16
    min_length: 86
    fields:
      - { name: "Board HW", off: 0 }
      - { name: "Board HW 1", off: 1 }
      - { name: "Board HW 2", off: 2 }
      - { name: "Micom vehicle", off: 3, enum: vehicle }
      - { name: "Micom region", off: 4, enum: country }
      # Printed "%03d." after the region.
      - { name: "Micom number", off: 5, type: u16 }
      # "Mmm dd yyyy": the build date, shown as yyyy.mm.dd-ish by parseBuildDate.
      - { name: "Micom build date", off: 7, type: str, size: 11 }
      # The CAN database's release date, BCD yy mm dd after a century byte (0x20,
      # or 0 in the 2023 NE1 builds); the formatter skips byte 0 and prints
      # "yy.mm.dd". In emulation 2020-10-01 (OS PE EV) to 2024-04-01 (EV6), a
      # constant in the image's data that moves with the build; the body CAN DB
      # below was zero in all 22 builds.
      - { name: "MM CAN DB 0", off: 18 }
      - { name: "MM CAN DB 1", off: 19 }
      - { name: "MM CAN DB 2", off: 20 }
      - { name: "MM CAN DB 3", off: 21 }
      - { name: "Body CAN DB 0", off: 22 }
      - { name: "Body CAN DB 1", off: 23 }
      - { name: "Body CAN DB 2", off: 24 }
      - { name: "Body CAN DB 3", off: 25 }
      - { name: "External amp 0", off: 26 }
      - { name: "External amp 1", off: 27 }
      - { name: "External amp tuning 0", off: 28 }
      - { name: "External amp tuning 1", off: 29 }
      # "V%02d.%02d" is this one's format in the decompile, which is garbled here.
      - { name: "External monitor 0", off: 30 }
      - { name: "External monitor 1", off: 31 }
      - { name: "External CD 0", off: 32 }
      - { name: "External CD 1", off: 33 }
      - { name: "Audio DSP tuning", off: 34, type: str, size: 8 }
      - { name: "Radio DSP tuning", off: 42, type: str, size: 8 }
      - { name: "HD module", off: 50, type: str, size: 36 }
    status: code
    ref: "EV6 V015.011 automotive EngineeringModeVersion.checkVersion; EngineeringModeService.onVersion; SystemService func 0x8116 -> onVersion; HKMC_EngineerMode MicomVersionInfo (indices 1, 4, 5, 8); never captured"

  # Answers to the part-number and trim requests below. Fleet scan (250 Gen5W
  # packages, 8 SystemService builds): part number is missing from 3 builds, 8
  # packages (V011.005, V013.001 and a V015.011-V016.010 group of 6); trim is in
  # all. (regulation type B is
  # already in kia-ev6-gen5w, captured). All are
  # read from EV6 V015.011 SystemService, never captured.
  #
  # Part number: the whole payload, US-ASCII, any length; stock stores it in
  # sys.product.partnumber. Shown as its first byte only: a field needs a size.
  - name: "Part number"
    dir: from_micom
    hdr: system_rx
    cmd: 0x99
    min_length: 1
    fields:
      - { name: "Part number", off: 0, type: str, size: 1 }
    status: code
    ref: "EV6 V015.011 SystemService$MicomEventHandler SYS_PART_NUMBER_M_RESP: new String(data, US-ASCII) -> sys.product.partnumber"
  # Vehicle trim: byte 0, kept as InitialCarInfo.mVehicleTrim and broadcast as
  # "trimInfo". Values seen in code: 1 selects the "dr1" display set in
  # BlackScreenService and the dual-light data in USMService; others are not
  # named there.
  - name: "Vehicle trim"
    dir: from_micom
    hdr: system_rx
    cmd: 0x75
    min_length: 1
    fields:
      - { name: "Trim", off: 0 }
    status: code
    ref: "EV6 V015.011 SystemService func 0x8175 -> InitialCarInfo.setVehicleTrimInfo, USMService/BlackScreenService readers"

  # Status frames SystemService.MicomEventHandler reads (EV6 V015.011), all
  # `system_rx` replies to nothing in particular: the micom sends them as the
  # state changes, and each can be asked for where a request exists. Layouts
  # are what the handler reads; none was captured. Names are stock's SYS_*.
  # Not here: gear (0x26) and parking brake (0x29), which kia-ev6-gen5w has
  # from live frames: the EV6 sends 0/1 there, not stock's GearStatus codes.
  - name: "Front/rear camera status"
    dir: from_micom
    hdr: system_rx
    cmd: 0x04
    min_length: 1
    fields:
      - { name: "Camera", off: 0, enum: camera_status }
    status: code
    ref: "SYS_FRONT_REAR_CAMERA_STATUS_M 0x8104 -> onFRCameraStatus"
  - name: "Distance to empty"
    dir: from_micom
    hdr: system_rx
    cmd: 0x2a
    min_length: 3
    fields:
      - { name: "Unit", off: 0, enum: trip_unit }
      - { name: "Distance", off: 1, type: u16 }
    status: code
    ref: "SYS_DISTANCE_TO_EMPTY_STATUS_M 0x812a -> onDTEInfoChanged(unit, bytesToInt(data, 1, 2))"
  - name: "Ambient temperature (C)"
    dir: from_micom
    hdr: system_rx
    cmd: 0x2b
    min_length: 1
    fields:
      - { name: "Temperature", off: 0 }
    status: code
    ref: "SYS_AMBIENT_TEMP_C_STATUS_M 0x812b -> onAmbientCelciusTempChanged; scaling not read"
  - name: "Ambient temperature (F)"
    dir: from_micom
    hdr: system_rx
    cmd: 0x2c
    min_length: 1
    fields:
      - { name: "Temperature", off: 0 }
    status: code
    ref: "SYS_AMBIENT_TEMP_F_STATUS_M 0x812c -> onAmbientFahrenheitTempChanged; scaling not read"
  - name: "Vehicle warning"
    dir: from_micom
    hdr: system_rx
    cmd: 0x34
    min_length: 2
    fields:
      - { name: "Warning 0", off: 0 }
      - { name: "Warning 1", off: 1 }
    status: code
    ref: "SYS_VEHICLE_WARNING_M 0x8134 -> onVehicleWarningStatus(b0, b1); meaning not read"
  - name: "IGN3 status"
    dir: from_micom
    hdr: system_rx
    cmd: 0x35
    min_length: 1
    fields:
      - { name: "On", off: 0, type: bool }
    status: code
    ref: "SYS_IGN3_STATUS_M 0x8135: 1 is on -> onIGNStatus"
  - name: "DCT warning"
    dir: from_micom
    hdr: system_rx
    cmd: 0x38
    min_length: 1
    fields:
      - { name: "Warning", off: 0, enum: dct_warning }
    status: code
    ref: "SYS_DCT_WARNING_M 0x8138 -> onDctWarning"
  - name: "HVAC type"
    dir: from_micom
    hdr: system_rx
    cmd: 0x3a
    min_length: 1
    fields:
      - { name: "Type", off: 0, enum: hvac_type }
    status: code
    ref: "SYS_HVAC_TYPE_M 0x813a: stock keeps it in persist.sys.hvactype"
  - name: "Fuel type"
    dir: from_micom
    hdr: system_rx
    cmd: 0x3b
    min_length: 1
    fields:
      - { name: "Type", off: 0, enum: fuel_type }
    status: code
    ref: "SYS_FUEL_TYPE_M 0x813b -> SystemService.getFuelType"
  - name: "FSOC check result"
    dir: from_micom
    hdr: system_rx
    cmd: 0x59
    min_length: 2
    fields:
      - { name: "FSOC result", off: 0 }
      - { name: "BSOC result", off: 1 }
    status: code
    ref: "SYS_FSOC_M_RESP 0x8159 -> broadcast com.mobis.action.FSOC_CHECK_RESULT with extras FSOC_CHECK_RESULT and BSOC_CHECK_RESULT; answer to fsoc request 0x0159"
  - name: "Eco coasting status"
    dir: from_micom
    hdr: system_rx
    cmd: 0x5c
    min_length: 1
    fields:
      - { name: "Status", off: 0 }
    status: code
    ref: "SYS_ECO_COASTING_STATUS_M_RESP 0x815c -> SystemService.getEcoCoastingStatus"
  - name: "Terrain mode"
    dir: from_micom
    hdr: system_rx
    cmd: 0x64
    min_length: 2
    fields:
      - { name: "Mode", off: 0 }
      - { name: "Supported", off: 1, type: bool }
    status: code
    ref: "SYS_TERRAIN_MODE_M 0x8164 -> broadcast com.mobis.action.TERRAIN_MODE_STATUS (terrainMode, support: byte 1 > 0)"
  - name: "WPC status"
    dir: from_micom
    hdr: system_rx
    cmd: 0x70
    min_length: 1
    fields:
      - { name: "Status", off: 0 }
    status: code
    ref: "SYS_WPCWARNING_M_RESP 0x8170 -> broadcast com.mobis.intent.action.WPC_STATUS_CHANGED (WPC_STATUS); answer to wpc request 0x0170"
  - name: "Class status"
    dir: from_micom
    hdr: system_rx
    cmd: 0x98
    min_length: 1
    fields:
      - { name: "Class", off: 0 }
    status: code
    ref: "SYS_CLASS_STA_M_RESP 0x8198 -> onClassStatus(byteToInt(b0)); answer to class request 0x0198"

# SystemService requests that reset, rewrite or reconfigure the micom. They are
# on the system header (sendPacket(0x8a, 1, func)); the `dangerous` string marks
# each so it is documented here yet refused on every path unless -allow-dangerous
# (this replaces the old hardcoded Go denylist). From jadx SystemService.java.
send:
  - {
      name: sys-power-config,
      pattern: "ff 8a 01 01 01 02 00 02 [00-ff] ..",
      status: inferred,
      dangerous: "func 0x0102 SYS_POWER_C: writes the micom's power configuration (EEPROM 0x1ad); value 0 makes ACC-off skip straight to bus sleep",
      ref: "jadx SystemService; EV6 micom dispatcher cmd 0x02, firmware emulation",
    }
  - {
      name: rear-camera-reset,
      frame: "ff 8a 01 01 01 05 00 01 70",
      status: inferred,
      dangerous: "func 0x0105 requestRearCameraReset",
      ref: "jadx SystemService",
    }
  - {
      name: last-info-init,
      frame: "ff 8a 01 01 01 07 00 01 72",
      status: inferred,
      dangerous: "func 0x0107 requestLastInfoInitialization (also requestMicomFactoryReset)",
      ref: "jadx SystemService",
    }
  - {
      name: variant-code-save,
      pattern: "ff 8a 01 01 01 18 00 02 [00-ff] ..",
      status: inferred,
      dangerous: "func 0x0118 requestVariantCodeSave: writes the variant coding",
      ref: "jadx SystemService. The micom's cmd 0x18 handler (V002.208 build, 0x7892a) overwrites payload bytes 0-1 with the build's own vehicle and country (0xcc, 6 on the EV6 CAN build), copies bytes 2-12 into the variant record in RAM (0x40011964) and stores 20 bytes through its key-value routine (0xa52f0). The store is an SPI memory on DSPI 0xFFFA0000, chip select 0 (write enable 0x06, then write 0x02 with a 16-bit address, the record at 0x0000). In emulation the micom writes the new record there, then writes the previous values back (options a2 00 00 80, language en) a moment later, then zero-fills a table of 28-byte entries from address 0x0800 up. That second write is the handler's own follow-up: after the first save it calls 0x399a(2, 0), a configuration (re)initialisation routine whose modes 0 and 2 skip its signature checks (version 301, vehicle 0xcc, country 6, a build signature) and go through 0x3320, which saves the record again; the handler then posts event 0xc3 with 8, the VARIANT_SAVE boot reason, and resumes. No CPU-driven SPI read follows (DMA reads would not show in the trace), and the flag byte at 0x40016cbd does not change it. The second record is not a reload: 0x3320 reads hardware inputs through the peripheral driver (pins 0x76 and 0x43 among them) and rebuilds the record from those and ROM defaults. In emulation raising pin 118 clears bit 7 of the first option byte (a2 becomes 22), pin 67 clears bit 5 (a2 becomes 82), both give 02: the Navigation and Internal amp bits follow those two pins (active low), the language and the rest are defaults.",
    }
  - {
      name: spi-sending-stop,
      frame: "ff 8a 01 01 01 1e 00 01 6b",
      status: code,
      dangerous: "func 0x011e requestSPISendingStop",
      ref: "SystemService sends it only on android.intent.action.ACTION_SHUTDOWN (log: request SPI sending stop; its sole caller, a BroadcastReceiver). The micom's cmd 0x1e handler (V002.208 build, 0x78abc) waits and then runs a peripheral setup routine from RAM state; in emulation it sends no reply and nothing else changes (the DSPI is barely modelled). SPI is the micom's bus to the Dirana and Saturn radio ICs.",
    }
  - {
      name: vbus-off-on,
      frame: "ff 8a 01 01 01 28 00 01 5d",
      status: inferred,
      dangerous: "func 0x0128 requestVBusOffOn",
      ref: "jadx SystemService",
    }
  # The micom's CPU-alive requests, on and off: boot leaves them off; on, the
  # micom resets a SoC that stops answering them.
  - {
      name: cpu-alive-start,
      frame: "ff 8a 01 01 01 11 00 01 64",
      status: code,
      ref: "SystemService.requestCPUAliveTransStart: sendPacket(-118, 1, 0x111); EV6 micom firmware: dispatcher cmd 0x11 clears its alive-off flag, alive requests follow (firmware emulation)",
    }
  - {
      name: cpu-alive-stop,
      frame: "ff 8a 01 01 01 10 00 01 65",
      status: code,
      ref: "SystemService.requestCPUAliveTransStop: sendPacket(-118, 1, 0x110); EV6 micom firmware: dispatcher cmd 0x10 sets the flag again",
    }
  # Asks for the module-version table (VersionModule.requestVersion:
  # sendMicomData(0x8a, 1, 1, 1, 0x74, [0]), one payload byte 00). Read-only.
  - {
      name: module-version-request,
      frame: "ff 8a 01 01 01 74 00 02 00 02",
      status: code,
      ref: "EV6 V015.011 HKMC_EngineerMode VersionModule.requestVersion; never captured",
    }
  # Asks for the version info (SystemService.requestDeviceVersion:
  # sendPacket(-118, 1, 0x116)). Read-only.
  - {
      name: version-info-request,
      frame: "ff 8a 01 01 01 16 00 01 63",
      status: code,
      ref: "EV6 V015.011 SystemService.requestVersion -> requestDeviceVersion; never captured",
    }
  # Read-only status requests, no payload; the reply has the same cmd on system_rx.
  - {
      name: part-number-request,
      frame: "ff 8a 01 01 01 99 00 01 ec",
      status: code,
      ref: "SystemService.requestPartNumber: sendPacket(-118, 1, 0x199); never captured",
    }
  - {
      name: vehicle-trim-request,
      frame: "ff 8a 01 01 01 75 00 01 00",
      status: code,
      ref: "SystemService.requestVehiceTrimInfo: sendPacket(-118, 1, 0x175); never captured",
    }
  - {
      name: regulation-type-request,
      frame: "ff 8a 01 01 01 89 00 01 fc",
      status: code,
      ref: "SystemService.requestRegulationTypeBStatus: sendPacket(-118, 1, 0x189); its 0x8189 answer is captured unprompted, the request itself is not",
    }
  # The lights HAL writes this (10 bytes, checksum byte 0) to micomd's
  # micom_mux_wronly socket; whether micomd or the micom fills the checksum is
  # not known. Turns the backlight on or off.
  - {
      name: monitor-backlight-set,
      pattern: "ff 8c 08 01 08 02 00 02 [00-01] ..",
      status: code,
      ref: "stock lights.tcc803x.so set_backlight_state: MON_SET_BACKLIGHT_C 0x0802, payload 1 on, 0 off; never captured",
    }
  # MicomAudioService turns the audio HAL's mic-volume message (a local
  # socket, not the micom link) into this: the voice DSP's mic level, step * 2 +
  # 0x20 for a step of 0-33 (0x20-0x62), 0x34 as the default. Header
  # audio_tx, func 0x0220.
  - {
      name: audio-mic-volume-set,
      pattern: "ff 85 02 01 02 20 00 02 [20-62] ..",
      status: code,
      ref: "stock MicomAudioService$DspMicThreadRunner: sendPacket func 0x0220 (AUDIO_SET_MIC_VOLUME_C) with level step*2+0x20, 0x34 for step 100; never captured",
    }
