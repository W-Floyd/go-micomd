# Family base: Hyundai/Kia/Genesis head units on the Mobis DAudio Plus Gen5 Wide
# (Telechips TCC803x) software stack. Only what the shared stock code says;
# what one car showed goes in that car's file.
#
# Not here, because it is micomd's own code: framing and checksum, the
# CPU-alive exchange (01 8a 01 81 / 8a 01 01 01, cmd 0f), the send denylist.
schema: 1
name: hkmc-gen5w
title: "HKMC Gen5 Wide family base: keepalive and shared layouts only"
abstract: true

headers:
  # sendPacket(0x8a, module 1, func 0x01xx), the framing of the captured
  # 0x010F alive reply.
  system_tx: { hdr: "8a 01 01 01", dir: to_micom, status: captured, ref: "the CPU-alive reply" }
  system_rx: { hdr: "01 8a 01 81", dir: from_micom, status: captured, ref: "the CPU-alive request" }
  # MicomAudioService.sendCommand: sndId 0x85, rcvId 2, type 1.
  audio_tx: { hdr: "85 02 01 02", dir: to_micom, status: captured, ref: "stock micomd strace, source switch" }

identify:
  # Asks the micom for its variant coding. Sent only with -identify-request,
  # and, while it is inferred, -allow-inferred.
  request:
    name: variant-code-request
    frame: "ff 8a 01 01 01 17 00 01 62"
    status: inferred
    ref: "jadx SystemService.requestVariantCode(): sendPacket(-118, 1, 279) = func 0x0117; retried 5 times (EVENT_VARIANTCODING_RETRY)"
  # The answer, func 0x8117; decoded below. Its first two bytes are the codes
  # the bootloader passes as vehicle_info and country_info, so micomd matches
  # it as it does the command line, which a kexec does not carry over.
  reply:
    name: "Variant code"
    hdr: system_rx
    cmd: 0x17
    identity: { vehicle_info: Vehicle, country_info: Country }
    status: code
    ref: "micom firmware CV_E.USA.S5W_M.V002.208.220711, 0x0117 handler (0x7882a); answered in emulation"

# The cluster's turn-by-turn tables, from the stock ClusterService$NaviCluster
# packers and the GPM/DiPO maneuver setters (status code: never captured).
enums:
  # TBTInfo (0x0D04) display type. Byte 0 goes to the micom as the caller
  # gives it (ClusterService$NaviCluster.updateTBTInfo). 0x00-0x2e are
  # stock's own (Navigation$DisplayType: the native navigation's, a symbol
  # turned by the direction byte); GPM, the Android Auto sink, sends some of
  # those (0, 2, 32, 33) and its own 64-176 beside them, which this car's
  # stock firmware shipped with, so the cluster takes both.
  maneuver:
    none: 0                # NO_SYMBOL; the end of route
    no_info: 1             # NO_INFO
    depart: 2              # DIRECT_TO_DEST; GPM's depart, sent with no distance
    dest_reached: 3        # ARRIVED
    near_dest: 4           # NEAR_DEST
    arrived_off_map: 5     # ARRIVED_DEST_OFF_MAP
    off_road: 6            # OFF_ROAD
    off_map: 7             # OFF_MAP
    no_route_guide: 8      # NO_ROUTE_GUIDE, "NO ROUTE GUIDANCE(COMPASS)"
    calc_route: 9          # CALC_ROUTE
    recalc_route: 10       # RECALC_ROUTE
    roundabout_exit_right: 32   # EXIT_ROUNDABOUT_TRS_RIGHT
    roundabout_exit_left: 33    # EXIT_ROUNDABOUT_TRS_LEFT
    unknown: 64
    straight: 65           # also a merge
    slight_right: 66
    turn_right: 67
    sharp_right: 68
    sharp_left: 69
    turn_left: 70
    slight_left: 71
    # The setter's "L-hand" and "R-hand": which traffic side, or which way
    # the U-turn bends, is a guess.
    uturn_left: 72
    uturn_right: 73
    off_ramp_right: 81
    off_ramp_left: 82
    off_ramp: 86
    # Roundabout entries by exit angle; which angle each covers is unknown.
    roundabout_96: 96
    roundabout_97: 97
    roundabout_99: 99
    roundabout_100: 100
    roundabout_102: 102
    roundabout_103: 103
    roundabout_105: 105
    roundabout_106: 106
    # 112-117 are the destination kinds; 115 (the fourth) reads as arrived,
    # a guess. The others are left unnamed.
    destination: 112
    arrived: 115
    on_ramp: 172           # also a fork
    on_ramp_right: 173
    on_ramp_left: 174
    ferry: 176
  # The distance scale nibble; 15 is invalid.
  distance_unit: { m: 0, km: 1, mi: 2, ft: 3, yd: 4 }

  # The variant code's tables (automotive.jar VariantCoding). Vehicle codes
  # known by name only for these three; others read as numbers.
  vehicle: { cvev: 0xcc, neev: 0xbd, dn8: 0x6e }
  country: { korea: 0, us: 1, china: 2, general: 3, middleeast: 4, europe: 5, canada: 6, russia: 7, malaysia: 0x16 }
  # Tuning steps, kHz: FM/AM.
  radio_region: { khz_9_100: 0, khz_10_200: 1, khz_9_50: 2, khz_10_100: 3, khz_9_200: 4 }
  external_amp: { actune: 0, lexicon: 1 }
  camera: { r_cam: 0, r_cam_old: 1, lvs: 2, avm: 3 }
  hu_type: { daudio: 0, daudio_plus: 1 }
  camera_mode: { analog: 0, digital: 1 }
  dvd_region: { worldwide: 0, us: 1, eur: 2, kor: 3, c_s_america: 4, rus: 5, chn: 6 }
  adm: { "off": 0, "on": 1 }

messages:
  # The micom's variant record (RAM 0x40011964, EEPROM 0x0000), 13 bytes.
  # Vehicle and country are constants of the micom build (EV6 0xcc, Ioniq 5
  # 0xbd, Sonata 0x6e; country 01 in US and global builds, 00 in Korean). The
  # rest is the car's coding from the EEPROM. Values seen so far are only the
  # defaults an empty EEPROM gives, in emulation.
  #
  # Fields as stock Android splits them (SystemService.onVariantCode; the
  # 0x0118 save packs with the same masks). Bytes 2-5 are one big-endian
  # word W, W31 = byte 2 bit 7.
  #
  # Android derives its amp type (VariantCoding index 4) from two bits:
  # 0 internal if W29, else 2 Lexicon if W21, else 1 Actune. Kept as the two
  # bits: a field cannot combine bits. Whether persist.sys.amptype (expect:
  # amp_type) holds that code is unconfirmed: its writer was not found.
  # The climate variant (expect: climate_variant) is not in this reply:
  # stock sets persist.sys.climate.variant from DATCService's
  # DatcBypassStatus, a climate frame, so 0x8117 cannot check it.
  - name: "Variant code"
    dir: from_micom
    hdr: system_rx
    cmd: 0x17
    min_length: 13
    fields:
      - { name: "Vehicle",          off: 0, enum: vehicle }
      - { name: "Country",          off: 1, enum: country }
      - { name: "Navigation",       off: 2, bits: "7" }   # W31
      - { name: "Modem",            off: 2, bits: "6" }
      - { name: "Internal amp",     off: 2, bits: "5" }   # 0: external
      - { name: "Rear monitor",     off: 2, bits: "4" }
      - { name: "Radio region",     off: 2, bits: "3:1", enum: radio_region }
      - { name: "DMB",              off: 2, bits: "0" }
      - { name: "RHD",              off: 3, bits: "7" }
      - { name: "Limo",             off: 3, bits: "6" }
      - { name: "External amp",     off: 3, bits: "5", enum: external_amp }
      - { name: "Camera",           off: 3, bits: "4:3", enum: camera }
      - { name: "Advanced cluster", off: 3, bits: "2" }
      - { name: "HUD",              off: 3, bits: "1" }
      - { name: "Rear USB",         off: 3, bits: "0" }
      - { name: "RRC",              off: 4, bits: "7" }
      - { name: "CDC",              off: 4, bits: "6" }
      - { name: "ISDB",             off: 4, bits: "5" }   # "rearMIC" in logs and micomd
      - { name: "HD Radio",         off: 4, bits: "4" }
      - { name: "CMMB",             off: 4, bits: "3" }
      - { name: "Internal CDP",     off: 4, bits: "2" }
      - { name: "External CDP",     off: 4, bits: "1" }
      - { name: "Telematics",       off: 4, bits: "0" }
      - { name: "Diranarom",        off: 5, bits: "7" }
      - { name: "DAB",              off: 5, bits: "6" }
      - { name: "HU type",          off: 5, bits: "5", enum: hu_type }
      - { name: "Camera mode",      off: 5, bits: "4", enum: camera_mode }
      - { name: "GPS",              off: 5, bits: "3" }
      - { name: "Ext CDP feature",  off: 5, bits: "2" }
      - { name: "Sub board",        off: 5, bits: "1" }
      - { name: "RDS",              off: 5, bits: "0" }   # W0
      - { name: "DVD region",       off: 6, enum: dvd_region }
      # "en" in US and global builds, "ko" in Korean ones.
      - { name: "Language",         off: 7, type: str, size: 2 }
      # Opaque to Android: echoed in the 0x0118 save; Engineering Mode writes
      # them with 0x0194.
      - { name: "CPU variant 9",    off: 9 }
      - { name: "CPU variant 10",   off: 10 }
      - { name: "CPU variant 11",   off: 11 }
      # Android reads 0 off, 1 on; the firmware sets bit 7, which reads as 128.
      - { name: "ADM",              off: 12, enum: adm }
    status: code
    ref: "micom firmware 0x0117 handler; 61 S5W_M micom builds in emulation (en/ko, country 01/00); EV6 V015.012 automotive-service SystemService.onVariantCode/sendVariantCodeSave, automotive VariantCoding tables"
